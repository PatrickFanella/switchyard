# Arize Phoenix — self-hosted LLM observability for llama-line.
#
# Intended placement: almaz, under /opt/server/monitoring or /opt/server/dev
# after read-only host verification. Do not expose publicly until Caddy/
# Authelia routing is explicitly approved.
#
# Run locally for testing:
#   docker compose -f docker/phoenix.yml up
#
# llama-line config when Phoenix shares a Docker network with llama-line
# using the OTLP HTTP exporter:
#   phoenix:
#     enabled: true
#     otlp_endpoint: "http://phoenix:6006/v1/traces"
#
# llama-line config when Phoenix runs on almaz and llama-line is outside the
# compose network:
#   phoenix:
#     enabled: true
#     otlp_endpoint: "http://almaz:6006/v1/traces"

services:
  phoenix:
    image: arizephoenix/phoenix:version-16.0.0
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "10.0.0.200:6006:6006" # LAN-only Phoenix UI + OTLP HTTP /v1/traces
    expose:
      - "4317" # OTLP gRPC stays container-network only
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "60"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      # Optional external Postgres. Prefer setting this via an untracked .env
      # file on almaz; do not commit credentials.
      # PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:change-me@postgres:5432/phoenix
    volumes:
      - phoenix_data:/mnt/data
    networks:
      - llama_line_observability
      - monitoring

networks:
  llama_line_observability:
    name: llama_line_observability
  monitoring:
    external: true
    name: monitoring

volumes:
  phoenix_data:
    driver: local
