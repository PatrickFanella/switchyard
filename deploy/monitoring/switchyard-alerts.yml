groups:
  - name: switchyard
    rules:
      - alert: SwitchyardModelIngressDown
        expr: up{job="switchyard-model"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Switchyard model ingress is unavailable

      - alert: SwitchyardModelBrokerBacklog
        expr: switchyard_model_broker_queue_depth > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Switchyard model-broker queue has remained above 50 requests

      - alert: SwitchyardWorkerFailures
        expr: increase(switchyard_worker_failed_runs_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Switchyard workers have failed more than five runs in fifteen minutes

      - alert: SwitchyardNoRecentBackup
        expr: absent(switchyard_postgres_backup_last_success_timestamp_seconds{job="switchyard-model"}) or time() - switchyard_postgres_backup_last_success_timestamp_seconds{job="switchyard-model"} > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No successful Switchyard PostgreSQL backup has been recorded for 26 hours

      - alert: SwitchyardRestoreDrillFailed
        expr: switchyard_restore_drill_last_result{job="switchyard-model"} == 0
        labels:
          severity: critical
        annotations:
          summary: The last Switchyard disposable restore drill failed

      - alert: SwitchyardRestoreDrillOverdue
        expr: absent(switchyard_restore_drill_next_deadline_timestamp_seconds{job="switchyard-model"}) or time() > switchyard_restore_drill_next_deadline_timestamp_seconds{job="switchyard-model"}
        labels:
          severity: critical
        annotations:
          summary: Switchyard restore-drill deadline telemetry is absent or expired
