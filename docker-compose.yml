services:
  postgres:
    image: postgres:17@sha256:0af65001d05296a2ead57ac4a6412433d8913d1bb5d0c88435a7d1e1ee5cb04b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong random value}
    ports:
      - "${SWITCHYARD_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-switchyard} -d $${POSTGRES_DB:-switchyard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: api
      args:
        SWITCHYARD_SOURCE_REVISION: ${SWITCHYARD_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    user: "${OPENCODE_RUNTIME_UID:-1000}:${OPENCODE_RUNTIME_GID:-1000}"
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      DATABASE_URL: host=postgres port=5432 user=${POSTGRES_USER:-switchyard} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong random value} dbname=${POSTGRES_DB:-switchyard} sslmode=disable
      MODEL_BROKER_TIMEOUT: ${MODEL_BROKER_TIMEOUT:-10m}
      MODEL_BROKER_QUEUE_MAX_DEPTH: ${MODEL_BROKER_QUEUE_MAX_DEPTH:-100}
      MODEL_BROKER_QUEUE_WORKERS: ${MODEL_BROKER_QUEUE_WORKERS:-1}
      MODEL_BROKER_RETRY_ATTEMPTS: ${MODEL_BROKER_RETRY_ATTEMPTS:-1}
      MODEL_BROKER_RETRY_BACKOFF: ${MODEL_BROKER_RETRY_BACKOFF:-250ms}
      MODEL_BROKER_BACKEND: ${MODEL_BROKER_BACKEND:-}
      LLAMA_LINE_BASE_URL: ${LLAMA_LINE_BASE_URL:-}
      LLAMA_LINE_API_KEY: ${LLAMA_LINE_API_KEY:-}
      MODEL_BROKER_RECOVERY_STALE_AFTER: ${MODEL_BROKER_RECOVERY_STALE_AFTER:-15m}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MODEL_BROKER_OLLAMA_MODELS: ${MODEL_BROKER_OLLAMA_MODELS:-llama,qwen,mistral,codellama,nomic-embed,bge,deepseek,gemma,phi,hermes}
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-http://opencode:4096}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-switchyard}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-switchyard-local-opencode-password}
      OPENCODE_EXECUTOR_TIMEOUT: ${OPENCODE_EXECUTOR_TIMEOUT:-10m}
      OPENCODE_EXECUTOR_BACKEND: ${OPENCODE_EXECUTOR_BACKEND:-}
      OCQ_BASE_URL: ${OCQ_BASE_URL:-}
      OCQ_GATEWAY_KEY: ${OCQ_GATEWAY_KEY:-}
      OPENCODE_SESSION_CREATE_TIMEOUT: ${OPENCODE_SESSION_CREATE_TIMEOUT:-5s}
      OPENCODE_MESSAGE_TIMEOUT: ${OPENCODE_MESSAGE_TIMEOUT:-10m}
      OPENCODE_ABORT_TIMEOUT: ${OPENCODE_ABORT_TIMEOUT:-1s}
      BLACKTOWER_BASE_URL: ${BLACKTOWER_BASE_URL:-}
      CHANGEMAKER_BASE_URL: ${CHANGEMAKER_BASE_URL:-}
      CHANGEMAKER_ADMIN_TOKEN: ${CHANGEMAKER_ADMIN_TOKEN:-}
      SWITCHYARD_PUBLIC_URL: ${SWITCHYARD_PUBLIC_URL:-}
      SWITCHYARD_REVERSE_PROXY_AUTH: ${SWITCHYARD_REVERSE_PROXY_AUTH:-false}
      SWITCHYARD_REVERSE_PROXY_TOKEN: ${SWITCHYARD_REVERSE_PROXY_TOKEN:-}
      SWITCHYARD_CONTROL_API_TOKEN: ${SWITCHYARD_CONTROL_API_TOKEN:-}
      SWITCHYARD_CONTROL_READ_TOKEN: ${SWITCHYARD_CONTROL_READ_TOKEN:-}
      SWITCHYARD_DEPLOYMENT_ID: ${SWITCHYARD_DEPLOYMENT_ID:-}
      SWITCHYARD_COMPATIBILITY_OBSERVER_ENABLED: ${SWITCHYARD_COMPATIBILITY_OBSERVER_ENABLED:-true}
      SWITCHYARD_CORS_ALLOWED_ORIGINS: ${SWITCHYARD_CORS_ALLOWED_ORIGINS:-}
      SWITCHYARD_LISTEN_ADDR: ${SWITCHYARD_LISTEN_ADDR:-:8080}
      LLAMA_LINE_LISTEN_ADDR: ${LLAMA_LINE_LISTEN_ADDR:-:11434}
      SWITCHYARD_SCHEDULER_ENABLED: ${SWITCHYARD_SCHEDULER_ENABLED:-true}
      SWITCHYARD_SCHEDULER_INTERVAL: ${SWITCHYARD_SCHEDULER_INTERVAL:-1m}
      SWITCHYARD_SCHEDULER_TIMEZONE: ${SWITCHYARD_SCHEDULER_TIMEZONE:-UTC}
      SWITCHYARD_WORKER_ENABLED: ${SWITCHYARD_WORKER_ENABLED:-true}
      SWITCHYARD_WORKER_COUNT: ${SWITCHYARD_WORKER_COUNT:-1}
      SWITCHYARD_WORKER_LEASE: ${SWITCHYARD_WORKER_LEASE:-5m}
      SWITCHYARD_WORKER_POLL_INTERVAL: ${SWITCHYARD_WORKER_POLL_INTERVAL:-1s}
      SWITCHYARD_RUN_MAX_ATTEMPTS: ${SWITCHYARD_RUN_MAX_ATTEMPTS:-3}
      SWITCHYARD_RUN_RETRY_BACKOFF: ${SWITCHYARD_RUN_RETRY_BACKOFF:-5s}
      SWITCHYARD_RUN_RETRY_MAX_BACKOFF: ${SWITCHYARD_RUN_RETRY_MAX_BACKOFF:-5m}
      SWITCHYARD_RUN_TIMEOUT: ${SWITCHYARD_RUN_TIMEOUT:-10m}
      SWITCHYARD_SHUTDOWN_GRACE: ${SWITCHYARD_SHUTDOWN_GRACE:-30s}
      SWITCHYARD_RETENTION: ${SWITCHYARD_RETENTION:-720h}
      SWITCHYARD_RETENTION_INTERVAL: ${SWITCHYARD_RETENTION_INTERVAL:-24h}
      SWITCHYARD_MAX_REQUEST_BYTES: ${SWITCHYARD_MAX_REQUEST_BYTES:-1048576}
      SWITCHYARD_MAX_PROMPT_BYTES: ${SWITCHYARD_MAX_PROMPT_BYTES:-65536}
      SWITCHYARD_MAX_MODEL_RESPONSE_BYTES: ${SWITCHYARD_MAX_MODEL_RESPONSE_BYTES:-1048576}
      SWITCHYARD_MAX_ARTIFACT_BYTES: ${SWITCHYARD_MAX_ARTIFACT_BYTES:-1048576}
      SWITCHYARD_RATE_LIMIT_PER_SECOND: ${SWITCHYARD_RATE_LIMIT_PER_SECOND:-50}
      SWITCHYARD_HTTP_ALLOWED_HOSTS: ${SWITCHYARD_HTTP_ALLOWED_HOSTS:-}
      SWITCHYARD_HTTP_ALLOW_INSECURE: ${SWITCHYARD_HTTP_ALLOW_INSECURE:-false}
      SWITCHYARD_HTTP_TIMEOUT: ${SWITCHYARD_HTTP_TIMEOUT:-15s}
      SWITCHYARD_EXECUTOR_LIMITS: ${SWITCHYARD_EXECUTOR_LIMITS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-x-project-name=switchyard}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-switchyard}
      OTEL_EXPORTER_OTLP_TRACES_PATH: ${OTEL_EXPORTER_OTLP_TRACES_PATH:-/v1/traces}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-10000}
      SWITCHYARD_TRACE_UI_URL: ${SWITCHYARD_TRACE_UI_URL:-}
      OPEN_PILOT_AUTONOMY_MODE: ${OPEN_PILOT_AUTONOMY_MODE:-manual}
      OPEN_PILOT_COMMAND: ${OPEN_PILOT_COMMAND:-}
      DEVLOG_MODEL: ${DEVLOG_MODEL:-gpt-5.4}
      OPEN_PILOT_MODEL: ${OPEN_PILOT_MODEL:-gpt-5.4}
      DEVLOG_ALLOWED_MODELS: ${DEVLOG_ALLOWED_MODELS:-gpt-5.4}
      DEVLOG_ALLOWED_REPOS: ${DEVLOG_ALLOWED_REPOS:-}
      OPEN_PILOT_ALLOWED_MODELS: ${OPEN_PILOT_ALLOWED_MODELS:-gpt-5.4}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      SWITCHYARD_WEBHOOK_LISTEN_ADDR: ${SWITCHYARD_WEBHOOK_LISTEN_ADDR:-}
      SWITCHYARD_WEBHOOK_CONFIG_FILE: ${SWITCHYARD_WEBHOOK_CONFIG_FILE:-}
      SWITCHYARD_WEBHOOK_SECRET_DIR: ${SWITCHYARD_WEBHOOK_SECRET_DIR:-}
      SWITCHYARD_WEBHOOK_TIMEOUT: ${SWITCHYARD_WEBHOOK_TIMEOUT:-5s}
      SWITCHYARD_WEBHOOK_MAX_CONCURRENCY: ${SWITCHYARD_WEBHOOK_MAX_CONCURRENCY:-32}
      SWITCHYARD_WEBHOOK_RATE_LIMIT_PER_SECOND: ${SWITCHYARD_WEBHOOK_RATE_LIMIT_PER_SECOND:-20}
      GITEA_GIT_USERNAME: ${GITEA_GIT_USERNAME:-oauth2}
      OPEN_PILOT_GIT_AUTHOR_NAME: ${OPEN_PILOT_GIT_AUTHOR_NAME:-Switchyard Open Pilot}
      OPEN_PILOT_GIT_AUTHOR_EMAIL: ${OPEN_PILOT_GIT_AUTHOR_EMAIL:-open-pilot@switchyard.local}
      OPEN_PILOT_ASSIGNEE: ${OPEN_PILOT_ASSIGNEE:-}
      OPEN_PILOT_REQUIRED_LABELS: ${OPEN_PILOT_REQUIRED_LABELS:-ready-for-agent,agent:queued}
      OPEN_PILOT_POLL_REPOS: ${OPEN_PILOT_POLL_REPOS:-}
      OPEN_PILOT_REQUIRE_ISSUE_SPEC: ${OPEN_PILOT_REQUIRE_ISSUE_SPEC:-false}
      OPEN_PILOT_CI_CHECK_MODE: ${OPEN_PILOT_CI_CHECK_MODE:-disabled}
      OPEN_PILOT_CI_AUTO_REPAIR_MODE: ${OPEN_PILOT_CI_AUTO_REPAIR_MODE:-disabled}
      OPEN_PILOT_MERGE_MODE: ${OPEN_PILOT_MERGE_MODE:-disabled}
      OPEN_PILOT_CLOSE_ISSUE_MODE: ${OPEN_PILOT_CLOSE_ISSUE_MODE:-disabled}
      OPEN_PILOT_REQUIRED_CHECKS: ${OPEN_PILOT_REQUIRED_CHECKS:-verify,lint,test}
      OPEN_PILOT_CI_CHECK_TIMEOUT: ${OPEN_PILOT_CI_CHECK_TIMEOUT:-10m}
      OPEN_PILOT_CI_CHECK_INTERVAL: ${OPEN_PILOT_CI_CHECK_INTERVAL:-15s}
      OPEN_PILOT_GIT_PUSH_MODE: ${OPEN_PILOT_GIT_PUSH_MODE:-disabled}
      OPEN_PILOT_ALLOW_LOCAL_GIT_REMOTE: ${OPEN_PILOT_ALLOW_LOCAL_GIT_REMOTE:-false}
      OPEN_PILOT_AUTO_COMMIT_MODE: ${OPEN_PILOT_AUTO_COMMIT_MODE:-disabled}
      OPEN_PILOT_GITEA_WRITE_MODE: ${OPEN_PILOT_GITEA_WRITE_MODE:-disabled}
      OPEN_PILOT_BASE_BRANCH: ${OPEN_PILOT_BASE_BRANCH:-main}
      OPEN_PILOT_BRANCH_PREFIX: ${OPEN_PILOT_BRANCH_PREFIX:-open-pilot/}
      OPEN_PILOT_PR_DRAFT: ${OPEN_PILOT_PR_DRAFT:-true}
      OPEN_PILOT_COMMAND_POLICY_MODE: ${OPEN_PILOT_COMMAND_POLICY_MODE:-deny}
      OPEN_PILOT_ALLOWED_COMMANDS: ${OPEN_PILOT_ALLOWED_COMMANDS:-git,go,make,pnpm,npm,cargo}
      OPEN_PILOT_ALLOWED_GIT_VERBS: ${OPEN_PILOT_ALLOWED_GIT_VERBS:-status,diff,checkout,switch,branch,add,commit}
      OPEN_PILOT_DENIED_COMMANDS: ${OPEN_PILOT_DENIED_COMMANDS:-rm,sudo,curl,wget,ssh,scp,docker,chmod,chown,dd,mkfs,bash,sh,zsh,fish}
      OPEN_PILOT_COMMAND_TIMEOUT: ${OPEN_PILOT_COMMAND_TIMEOUT:-120s}
      OPEN_PILOT_VERIFIER_URL: http://verifier:8090
      OPEN_PILOT_WORKDIR: ${OPEN_PILOT_WORKDIR:-}
      OPEN_PILOT_WORKTREE_MODE: ${OPEN_PILOT_WORKTREE_MODE:-disabled}
      OPEN_PILOT_WORKTREE_CLEANUP: ${OPEN_PILOT_WORKTREE_CLEANUP:-disabled}
      OPEN_PILOT_REPO_PATH: ${OPEN_PILOT_REPO_PATH:-/workspace}
      OPEN_PILOT_WORKTREE_ROOT: ${OPEN_PILOT_WORKTREE_ROOT:-/workspace/.open-pilot-worktrees}
      SWITCHYARD_OPEN_PILOT_RUNTIME_MANIFEST: ${SWITCHYARD_OPEN_PILOT_RUNTIME_MANIFEST:-}
      SWITCHYARD_OPEN_PILOT_ACTIVATION_MODE: ${SWITCHYARD_OPEN_PILOT_ACTIVATION_MODE:-legacy-singleton}
      OPEN_PILOT_EXECUTOR_GENERATION: ${OPEN_PILOT_EXECUTOR_GENERATION:-legacy}
      OPEN_PILOT_SINGLETON_REPOSITORY: ${OPEN_PILOT_SINGLETON_REPOSITORY:-}
      OPEN_PILOT_WORKTREE_TIMEOUT: ${OPEN_PILOT_WORKTREE_TIMEOUT:-120s}
      SWITCHYARD_BACKUP_METRICS_FILE: /var/lib/switchyard-metrics/backup.prom
      SWITCHYARD_RESTORE_DRILL_METRICS_FILE: /var/lib/switchyard-metrics/restore-drill.prom
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /workspace/*
      GIT_TERMINAL_PROMPT: "0"
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_healthy
      verifier:
        condition: service_healthy
    ports:
      - "${SWITCHYARD_BIND_HOST:-127.0.0.1}:${API_PORT:-18080}:8080"
      - "${SWITCHYARD_MODEL_BIND_HOST:-${SWITCHYARD_BIND_HOST:-127.0.0.1}}:${LLAMA_LINE_PORT:-11434}:11434"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: ${OPENCODE_WORKSPACE:-./tmp/opencode-workspace}
        target: /workspace
        bind:
          create_host_path: false
      # Mount the containing directory so atomic backup and restore-drill
      # textfile replacement remains visible without restarting the API.
      - type: bind
        source: ${SWITCHYARD_BACKUP_METRICS_DIR:-/dev/null}
        target: /var/lib/switchyard-metrics
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: ${SWITCHYARD_API_CONTAINER_IPV4:-172.31.250.4}
      verification:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  opencode:
    build:
      context: ./services/opencode
      args:
        SWITCHYARD_SOURCE_REVISION: ${SWITCHYARD_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    # The entrypoint uses this minimal bootstrap identity only to initialize
    # empty named state/cache volumes. Bind mounts must be pre-owned correctly.
    user: "0:0"
    environment:
      HOME: /home/opencode
      XDG_CONFIG_HOME: /home/opencode/.config
      XDG_DATA_HOME: /home/opencode/.local/share
      XDG_CACHE_HOME: /home/opencode/.cache
      XDG_STATE_HOME: /home/opencode/.local/state
      OPENCODE_SERVER_HOSTNAME: 0.0.0.0
      OPENCODE_SERVER_PORT: 4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-switchyard}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-switchyard-local-opencode-password}
      OPENCODE_SESSION_CREATE_TIMEOUT_MS: ${OPENCODE_SESSION_CREATE_TIMEOUT_MS:-5000}
      OPENCODE_MESSAGE_TIMEOUT_MS: ${OPENCODE_MESSAGE_TIMEOUT_MS:-600000}
      OPENCODE_SECURITY_MODE: ${OPENCODE_SECURITY_MODE:-strict}
      OPENCODE_DB: ${OPENCODE_DB:-:memory:}
      OPENCODE_DISABLE_PROJECT_CONFIG: ${OPENCODE_DISABLE_PROJECT_CONFIG:-true}
      OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: ${OPENCODE_DISABLE_CLAUDE_CODE_PROMPT:-true}
      OPENCODE_RUNTIME_UID: ${OPENCODE_RUNTIME_UID:-1000}
      OPENCODE_RUNTIME_GID: ${OPENCODE_RUNTIME_GID:-1000}
      OPEN_PILOT_WORKTREE_ROOT: ${OPEN_PILOT_WORKTREE_ROOT:-/workspace/.open-pilot-worktrees}
      GIT_OPTIONAL_LOCKS: "0"
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace/.open-pilot-worktrees
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /workspace/.open-pilot-worktrees/*
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Needed only to initialize empty named volumes before dropping privileges.
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const u=process.env.OPENCODE_SERVER_USERNAME,p=process.env.OPENCODE_SERVER_PASSWORD,d=process.env.OPEN_PILOT_WORKTREE_ROOT; fetch('http://127.0.0.1:4096/session?directory='+encodeURIComponent(d),{headers:{authorization:'Basic '+Buffer.from(u+':'+p).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - type: bind
        source: ${OPENCODE_WORKSPACE:-./tmp/opencode-workspace}/.git
        target: /workspace/.git
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCODE_WORKSPACE:-./tmp/opencode-workspace}/.open-pilot-worktrees
        target: /workspace/.open-pilot-worktrees
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCODE_CONFIG_DIR:-./.opencode}
        target: /home/opencode/.config/opencode
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCODE_DATA_DIR:-./opencode-data}
        target: /home/opencode/.local/share/opencode
        bind:
          create_host_path: false
      - opencode-state:/home/opencode/.local/state
      - opencode-cache:/home/opencode/.cache

  web:
    build:
      context: ./web
      args:
        SWITCHYARD_SOURCE_REVISION: ${SWITCHYARD_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SWITCHYARD_WEB_TRANSPORT: ${SWITCHYARD_WEB_TRANSPORT:-http}
      SWITCHYARD_WEB_TRUSTED_PROXY_CIDR: ${SWITCHYARD_WEB_TRUSTED_PROXY_CIDR:-100.77.128.80/32}
      SWITCHYARD_DASHBOARD_CIDR: ${SWITCHYARD_DASHBOARD_CIDR:-127.0.0.1/32}
      NGINX_ENVSUBST_FILTER: "^SWITCHYARD_(WEB_TRUSTED_PROXY|DASHBOARD)_CIDR$$"
    ports:
      - "${SWITCHYARD_WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8081}:80"
    networks:
      default:
        ipv4_address: ${SWITCHYARD_WEB_CONTAINER_IPV4:-172.31.250.10}

  verifier:
    build:
      context: ./backend
      target: verifier
    restart: unless-stopped
    user: "${OPENCODE_RUNTIME_UID:-1000}:${OPENCODE_RUNTIME_GID:-1000}"
    command: ["/app/verifier"]
    environment:
      OPEN_PILOT_WORKTREE_ROOT: ${OPEN_PILOT_WORKTREE_ROOT:-/workspace/.open-pilot-worktrees}
      OPEN_PILOT_GIT_COMMON_DIR: /workspace/.git
      GIT_OPTIONAL_LOCKS: "0"
      GIT_TERMINAL_PROMPT: "0"
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      GOTMPDIR: /cache
      CARGO_HOME: /cache/cargo
      PNPM_HOME: /cache/pnpm
      npm_config_cache: /cache/npm
      XDG_CACHE_HOME: /cache/xdg
      TMPDIR: /cache
      SWITCHYARD_VERIFIER_CONCURRENCY: "1"
      SWITCHYARD_VERIFIER_OUTPUT_BYTES: ${SWITCHYARD_VERIFIER_OUTPUT_BYTES:-1048576}
      SWITCHYARD_VERIFIER_SNAPSHOT_MAX_FILES: ${SWITCHYARD_VERIFIER_SNAPSHOT_MAX_FILES:-10000}
      SWITCHYARD_VERIFIER_SNAPSHOT_MAX_BYTES: ${SWITCHYARD_VERIFIER_SNAPSHOT_MAX_BYTES:-268435456}
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,exec,nosuid,size=1g,mode=1777
      - /cache:rw,exec,nosuid,size=512m,mode=1777
    volumes:
      - type: bind
        source: ${OPENCODE_WORKSPACE:-./tmp/opencode-workspace}/.git
        target: /workspace/.git
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCODE_WORKSPACE:-./tmp/opencode-workspace}/.open-pilot-worktrees
        target: /workspace/.open-pilot-worktrees
        read_only: true
        bind:
          create_host_path: false
    networks:
      - verification
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  opencode-cache:
  opencode-state:

networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: ${SWITCHYARD_DOCKER_BRIDGE_NAME:-switchyard0}
    ipam:
      config:
        - subnet: ${SWITCHYARD_DOCKER_BRIDGE_SUBNET:-172.31.250.0/24}
          gateway: ${SWITCHYARD_DOCKER_BRIDGE_GATEWAY:-172.31.250.1}
  verification:
    internal: true
