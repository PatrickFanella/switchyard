services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-switchyard} -d $${POSTGRES_DB:-switchyard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: host=postgres port=5432 user=${POSTGRES_USER:-switchyard} password=${POSTGRES_PASSWORD:-change-me} dbname=${POSTGRES_DB:-switchyard} sslmode=disable
      MODEL_BROKER_TIMEOUT: ${MODEL_BROKER_TIMEOUT:-10m}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MODEL_BROKER_OLLAMA_MODELS: ${MODEL_BROKER_OLLAMA_MODELS:-llama,qwen,mistral,codellama,nomic-embed,bge,deepseek,gemma,phi}
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-http://opencode:4096}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-switchyard}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-switchyard-local-opencode-password}
      OPENCODE_EXECUTOR_TIMEOUT: ${OPENCODE_EXECUTOR_TIMEOUT:-10m}
      BLACKTOWER_BASE_URL: ${BLACKTOWER_BASE_URL:-}
      SWITCHYARD_PUBLIC_URL: ${SWITCHYARD_PUBLIC_URL:-}
      SWITCHYARD_REVERSE_PROXY_AUTH: ${SWITCHYARD_REVERSE_PROXY_AUTH:-false}
      SWITCHYARD_SCHEDULER_ENABLED: ${SWITCHYARD_SCHEDULER_ENABLED:-false}
      SWITCHYARD_SCHEDULER_INTERVAL: ${SWITCHYARD_SCHEDULER_INTERVAL:-1m}
      SWITCHYARD_WORKER_ENABLED: ${SWITCHYARD_WORKER_ENABLED:-false}
      SWITCHYARD_WORKER_COUNT: ${SWITCHYARD_WORKER_COUNT:-1}
      SWITCHYARD_WORKER_LEASE: ${SWITCHYARD_WORKER_LEASE:-5m}
      SWITCHYARD_WORKER_POLL_INTERVAL: ${SWITCHYARD_WORKER_POLL_INTERVAL:-1s}
      SWITCHYARD_EXECUTOR_LIMITS: ${SWITCHYARD_EXECUTOR_LIMITS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-x-project-name=switchyard}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-switchyard}
      OTEL_EXPORTER_OTLP_TRACES_PATH: ${OTEL_EXPORTER_OTLP_TRACES_PATH:-/v1/traces}
      OPEN_PILOT_AUTONOMY_MODE: ${OPEN_PILOT_AUTONOMY_MODE:-manual}
      OPEN_PILOT_COMMAND: ${OPEN_PILOT_COMMAND:-}
      DEVLOG_MODEL: ${DEVLOG_MODEL:-gpt-5.4}
      OPEN_PILOT_MODEL: ${OPEN_PILOT_MODEL:-gpt-5.4}
      DEVLOG_ALLOWED_MODELS: ${DEVLOG_ALLOWED_MODELS:-gpt-5.4}
      OPEN_PILOT_ALLOWED_MODELS: ${OPEN_PILOT_ALLOWED_MODELS:-gpt-5.4}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_GIT_USERNAME: ${GITEA_GIT_USERNAME:-oauth2}
      OPEN_PILOT_REQUIRED_LABELS: ${OPEN_PILOT_REQUIRED_LABELS:-ready-for-agent,agent:queued}
      OPEN_PILOT_REQUIRE_ISSUE_SPEC: ${OPEN_PILOT_REQUIRE_ISSUE_SPEC:-false}
      OPEN_PILOT_CI_CHECK_MODE: ${OPEN_PILOT_CI_CHECK_MODE:-disabled}
      OPEN_PILOT_MERGE_MODE: ${OPEN_PILOT_MERGE_MODE:-disabled}
      OPEN_PILOT_CLOSE_ISSUE_MODE: ${OPEN_PILOT_CLOSE_ISSUE_MODE:-disabled}
      OPEN_PILOT_REQUIRED_CHECKS: ${OPEN_PILOT_REQUIRED_CHECKS:-verify,lint,test}
      OPEN_PILOT_CI_CHECK_TIMEOUT: ${OPEN_PILOT_CI_CHECK_TIMEOUT:-10m}
      OPEN_PILOT_CI_CHECK_INTERVAL: ${OPEN_PILOT_CI_CHECK_INTERVAL:-15s}
      OPEN_PILOT_GIT_PUSH_MODE: ${OPEN_PILOT_GIT_PUSH_MODE:-disabled}
      OPEN_PILOT_AUTO_COMMIT_MODE: ${OPEN_PILOT_AUTO_COMMIT_MODE:-disabled}
      OPEN_PILOT_GITEA_WRITE_MODE: ${OPEN_PILOT_GITEA_WRITE_MODE:-disabled}
      OPEN_PILOT_BASE_BRANCH: ${OPEN_PILOT_BASE_BRANCH:-main}
      OPEN_PILOT_BRANCH_PREFIX: ${OPEN_PILOT_BRANCH_PREFIX:-open-pilot/}
      OPEN_PILOT_PR_DRAFT: ${OPEN_PILOT_PR_DRAFT:-true}
      OPEN_PILOT_COMMAND_POLICY_MODE: ${OPEN_PILOT_COMMAND_POLICY_MODE:-deny}
      OPEN_PILOT_ALLOWED_COMMANDS: ${OPEN_PILOT_ALLOWED_COMMANDS:-git,go,make,pnpm,npm,cargo}
      OPEN_PILOT_ALLOWED_GIT_VERBS: ${OPEN_PILOT_ALLOWED_GIT_VERBS:-status,diff,checkout,switch,branch,add,commit}
      OPEN_PILOT_DENIED_COMMANDS: ${OPEN_PILOT_DENIED_COMMANDS:-rm,sudo,curl,wget,ssh,scp,docker,chmod,chown,dd,mkfs,bash,sh,zsh,fish}
      OPEN_PILOT_COMMAND_TIMEOUT: ${OPEN_PILOT_COMMAND_TIMEOUT:-120s}
      OPEN_PILOT_WORKDIR: ${OPEN_PILOT_WORKDIR:-}
      OPEN_PILOT_WORKTREE_MODE: ${OPEN_PILOT_WORKTREE_MODE:-disabled}
      OPEN_PILOT_WORKTREE_CLEANUP: ${OPEN_PILOT_WORKTREE_CLEANUP:-disabled}
      OPEN_PILOT_REPO_PATH: ${OPEN_PILOT_REPO_PATH:-}
      OPEN_PILOT_WORKTREE_ROOT: ${OPEN_PILOT_WORKTREE_ROOT:-}
      OPEN_PILOT_WORKTREE_TIMEOUT: ${OPEN_PILOT_WORKTREE_TIMEOUT:-120s}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_healthy
    ports:
      - "${API_PORT:-18080}:8080"
      - "${LLAMA_LINE_PORT:-11434}:8080"
    volumes:
      - ${OPENCODE_WORKSPACE:-.}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  opencode:
    build: ./services/opencode
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_HOSTNAME: 0.0.0.0
      OPENCODE_SERVER_PORT: 4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-switchyard}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-switchyard-local-opencode-password}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const u=process.env.OPENCODE_SERVER_USERNAME,p=process.env.OPENCODE_SERVER_PASSWORD; fetch('http://127.0.0.1:4096/session?directory=/workspace',{headers:{authorization:'Basic '+Buffer.from(u+':'+p).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ${OPENCODE_WORKSPACE:-.}:/workspace
      - ${OPENCODE_CONFIG_DIR:-./.opencode}:/root/.config/opencode
      - ${OPENCODE_DATA_DIR:-./opencode-data}:/root/.local/share/opencode

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  postgres-data:
