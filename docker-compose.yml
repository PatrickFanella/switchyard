services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-switchyard} -d $${POSTGRES_DB:-switchyard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: host=postgres port=5432 user=${POSTGRES_USER:-switchyard} password=${POSTGRES_PASSWORD:-change-me} dbname=${POSTGRES_DB:-switchyard} sslmode=disable
      LLAMA_LINE_BASE_URL: ${LLAMA_LINE_BASE_URL:-}
      LLAMA_LINE_API_KEY: ${LLAMA_LINE_API_KEY:-}
      LLAMA_LINE_ADMIN_KEY: ${LLAMA_LINE_ADMIN_KEY:-}
      OCQ_BASE_URL: ${OCQ_BASE_URL:-}
      OCQ_GATEWAY_KEY: ${OCQ_GATEWAY_KEY:-}
      BLACKTOWER_BASE_URL: ${BLACKTOWER_BASE_URL:-}
      CHANGEMAKER_BASE_URL: ${CHANGEMAKER_BASE_URL:-}
      CHANGEMAKER_ADMIN_TOKEN: ${CHANGEMAKER_ADMIN_TOKEN:-}
      SWITCHYARD_SCHEDULER_ENABLED: ${SWITCHYARD_SCHEDULER_ENABLED:-false}
      SWITCHYARD_SCHEDULER_INTERVAL: ${SWITCHYARD_SCHEDULER_INTERVAL:-1m}
      SWITCHYARD_WORKER_ENABLED: ${SWITCHYARD_WORKER_ENABLED:-false}
      SWITCHYARD_WORKER_COUNT: ${SWITCHYARD_WORKER_COUNT:-1}
      SWITCHYARD_WORKER_LEASE: ${SWITCHYARD_WORKER_LEASE:-5m}
      SWITCHYARD_WORKER_POLL_INTERVAL: ${SWITCHYARD_WORKER_POLL_INTERVAL:-1s}
      OPEN_PILOT_COMMAND: ${OPEN_PILOT_COMMAND:-}
      DEVLOG_MODEL: ${DEVLOG_MODEL:-opencode:gpt-5.5}
      OPEN_PILOT_MODEL: ${OPEN_PILOT_MODEL:-opencode:gpt-5.5}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      OPEN_PILOT_REQUIRED_LABELS: ${OPEN_PILOT_REQUIRED_LABELS:-ready-for-agent,agent:queued}
      OPEN_PILOT_REQUIRE_ISSUE_SPEC: ${OPEN_PILOT_REQUIRE_ISSUE_SPEC:-false}
      OPEN_PILOT_GITEA_WRITE_MODE: ${OPEN_PILOT_GITEA_WRITE_MODE:-disabled}
      OPEN_PILOT_BASE_BRANCH: ${OPEN_PILOT_BASE_BRANCH:-main}
      OPEN_PILOT_BRANCH_PREFIX: ${OPEN_PILOT_BRANCH_PREFIX:-open-pilot/}
      OPEN_PILOT_PR_DRAFT: ${OPEN_PILOT_PR_DRAFT:-true}
      OPEN_PILOT_COMMAND_POLICY_MODE: ${OPEN_PILOT_COMMAND_POLICY_MODE:-deny}
      OPEN_PILOT_ALLOWED_COMMANDS: ${OPEN_PILOT_ALLOWED_COMMANDS:-git,go,make,pnpm,npm,cargo}
      OPEN_PILOT_ALLOWED_GIT_VERBS: ${OPEN_PILOT_ALLOWED_GIT_VERBS:-status,diff,checkout,switch,branch,add,commit}
      OPEN_PILOT_DENIED_COMMANDS: ${OPEN_PILOT_DENIED_COMMANDS:-rm,sudo,curl,wget,ssh,scp,docker,chmod,chown,dd,mkfs,bash,sh,zsh,fish}
      OPEN_PILOT_COMMAND_TIMEOUT: ${OPEN_PILOT_COMMAND_TIMEOUT:-120s}
      OPEN_PILOT_WORKDIR: ${OPEN_PILOT_WORKDIR:-}
      OPEN_PILOT_WORKTREE_MODE: ${OPEN_PILOT_WORKTREE_MODE:-disabled}
      OPEN_PILOT_REPO_PATH: ${OPEN_PILOT_REPO_PATH:-}
      OPEN_PILOT_WORKTREE_ROOT: ${OPEN_PILOT_WORKTREE_ROOT:-}
      OPEN_PILOT_WORKTREE_TIMEOUT: ${OPEN_PILOT_WORKTREE_TIMEOUT:-120s}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-18080}:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  postgres-data:
