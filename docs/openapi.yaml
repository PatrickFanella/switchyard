    OpenPilotStateResponse:
      description: Open Pilot issue state response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              next_action: { type: string }
            required: [state, next_action]
    OpenPilotResumeResponse:
      description: Open Pilot resume response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
    OpenPilotAcceptedResumeResponse:
      description: Accepted async Open Pilot resume response
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
  schemas:
    ArtifactDailyBucket:
      type: object
      properties:
        date: { type: string, format: date }
        created: { type: integer, format: int64 }
        created_bytes: { type: integer, format: int64 }
        pruned: { type: integer, format: int64 }
        pruned_bytes: { type: integer, format: int64 }
        pruned_bytes_unmeasured: { type: integer, format: int64, description: Number of legacy pruned artifacts without measured decoded bytes. }
        net_change: { type: integer, format: int64 }
        net_bytes: { type: integer, format: int64 }
      required: [date, created, created_bytes, pruned, pruned_bytes, pruned_bytes_unmeasured, net_change, net_bytes]
    ArtifactReport:
      type: object
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        bucket: { type: string, const: day }
        observation_started_at: { type: string, format: date-time }
        observation_retained_floor: { type: integer, format: int64, minimum: 0, description: Retained artifact count captured before lifecycle mutation observation began. }
        observation_retained_floor_bytes: { type: integer, format: int64, minimum: 0, description: Measured retained bytes captured before lifecycle mutation observation began. }
        observation_retained_floor_bytes_unmeasured: { type: integer, format: int64, minimum: 0, description: Retained artifacts at the observation floor whose bytes were not measured. }
        retained: { type: integer, format: int64 }
        retained_bytes: { type: integer, format: int64 }
        retained_bytes_unmeasured: { type: integer, format: int64, description: Number of retained legacy artifacts excluded from retained_bytes because decoded size is unknown. }
        created_total: { type: integer, format: int64 }
        created_bytes_total: { type: integer, format: int64 }
        pruned_total: { type: integer, format: int64 }
        pruned_bytes_total: { type: integer, format: int64 }
        pruned_bytes_unmeasured_total: { type: integer, format: int64, description: Number of legacy artifacts excluded from pruned_bytes_total because decoded size is unknown. }
        declared_retention_missing: { type: integer, format: int64, description: Retained legacy artifacts without retention_until metadata. }
        declared_retention_expired: { type: integer, format: int64 }
        declared_retention_expired_bytes: { type: integer, format: int64 }
        declared_retention_expired_bytes_unmeasured: { type: integer, format: int64, description: Number of declared-expired legacy artifacts excluded from the byte sum. }
        retention_semantics: { type: string }
        buckets:
          type: array
          maxItems: 90
          items: { $ref: "#/components/schemas/ArtifactDailyBucket" }
      required: [window_start, window_end, bucket, observation_started_at, observation_retained_floor, observation_retained_floor_bytes, observation_retained_floor_bytes_unmeasured, retained, retained_bytes, retained_bytes_unmeasured, created_total, created_bytes_total, pruned_total, pruned_bytes_total, pruned_bytes_unmeasured_total, declared_retention_missing, declared_retention_expired, declared_retention_expired_bytes, declared_retention_expired_bytes_unmeasured, retention_semantics, buckets]
    CompatibilityObservation:
      type: object
      properties:
        date: { type: string, format: date }
        backend: { type: string, enum: [llama-line, ocq] }
        attempts: { type: integer, format: int64, minimum: 0 }
        source_revision: { type: string }
        deployment_id: { type: string }
        observation_started_at: { type: string, format: date-time }
        observation_completed_at: { type: string, format: date-time }
        observation_segment: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
      required: [date, backend, attempts, source_revision, deployment_id, observation_started_at, observation_completed_at, observation_segment]
    CompatibilityReport:
      type: object
      properties:
        version: { type: string, const: switchyard.compatibility-observation/v1 }
        source_revision: { type: string, pattern: "^[0-9a-f]{40}$" }
        source_identity: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        source_segment: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        window_start: { type: string, format: date }
        window_end: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        observations:
          type: array
          maxItems: 180
          items: { $ref: "#/components/schemas/CompatibilityObservation" }
        canonical_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        qualification_eligible: { type: boolean, description: False for non-durable diagnostic stores. }
      required: [version, source_revision, source_identity, source_segment, window_start, window_end, generated_at, observations, canonical_sha256, qualification_eligible]
    EvidenceHit:
      type: object
      description: Redacted evidence projection without inputs or bodies.
      properties:
        kind: { type: string, enum: [run, step, request] }
        id: { type: string }
        run_id: { type: string, description: Owning run for runs and steps; empty for requests. }
        workflow_id: { type: string, description: Workflow for runs and steps; empty for requests. }
        status: { type: string }
        title: { type: string, maxLength: 513, description: Workflow ID for runs, step name for steps, model for requests. }
        summary: { type: string, maxLength: 513, description: Run summary, step output summary, or request path and client. }
        error: { type: string, maxLength: 513 }
        correlation_ids: { $ref: "#/components/schemas/StringMap" }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
      required: [kind, id, status, title, created_at]
    EvidenceRetention:
      type: object
      properties:
        window: { type: string, description: Configured retention window as a Go duration string. }
        floor: { type: string, format: date-time, description: Records created before this instant are not searchable even if not yet pruned. }
        searched_at: { type: string, format: date-time }
      required: [window, floor, searched_at]
    EvidenceSearchPage:
      type: object
      properties:
        hits:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EvidenceHit" }
        next_cursor: { type: string, description: Opaque cursor for the next page; empty on the last page. }
        query: { type: string }
        scope: { type: string, enum: [all, runs, steps, requests, errors, correlations] }
        limit: { type: integer }
        retention: { $ref: "#/components/schemas/EvidenceRetention" }
      required: [hits, next_cursor, query, scope, limit, retention]
    StringMap:
      type: object
      additionalProperties: { type: string }
    OpenPilotGateStatus:
      type: object
      additionalProperties: { type: string }
    OpenPilotProofTarget:
      type: object
      additionalProperties: false
      properties:
        repository_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
        executor_generation: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
        repository_slug: { type: string }
        issue: { type: string, pattern: "^[1-9][0-9]*$" }
      required: [repository_id, executor_generation, repository_slug, issue]
    OpenPilotReadinessCheck:
      type: object
      properties:
        name: { type: string }
        code: { type: string, description: Stable reason code documented in docs/open-pilot.md }
        status: { type: string, enum: [pass, warn, fail, skip] }
        message: { type: string }
        remediation: { type: string }
      required: [name, code, status, message]
    OpenPilotInboxClaim:
      type: object
      properties:
        state_id: { type: string }
        phase: { type: string }
        run_id: { type: string }
        run_status: { type: string }
        active_run: { type: boolean }
        next_action: { type: string }
        last_step_name: { type: string }
        last_error: { type: string }
        failing_gate: { type: string }
        operator_summary: { type: string }
        recommended_next_action: { type: string }
        branch: { type: string }
        pull_request_url: { type: string }
        pull_request_number: { type: integer }
        merge_commit_sha: { type: string }
        issue_closed: { type: boolean }
        repair_attempts: { type: integer }
        max_repair_attempts: { type: integer }
        updated_at: { type: string, format: date-time }
      required: [state_id, phase, active_run, next_action, issue_closed, repair_attempts, max_repair_attempts, updated_at]
    OpenPilotInboxIssue:
      type: object
      properties:
        key: { type: string, description: "Canonical OWNER/REPO#issue" }
        repo: { type: string }
        repository_id: { type: string }
        executor_generation: { type: string }
        issue: { type: string }
        issue_id: { type: integer }
        title: { type: string }
        state: { type: string }
        labels: { type: array, items: { type: string } }
        assignees: { type: array, items: { type: string } }
        source: { type: string, enum: [upstream, state], description: upstream when listed by Gitea; state when only the durable claim is known }
        pickup: { type: string, enum: [assigned, labels, both, none, unknown] }
        bot_assigned: { type: boolean }
        labels_satisfied: { type: boolean }
        missing_labels: { type: array, items: { type: string } }
        spec_required: { type: boolean }
        spec_ready: { type: boolean }
        test_command: { type: string }
        eligible: { type: boolean, description: True when no check fails and dispatch would start a new lifecycle }
        action: { type: string, enum: [dispatch, resume, none] }
        reason_codes: { type: array, items: { type: string }, description: Codes of failing checks }
        checks: { type: array, items: { $ref: "#/components/schemas/OpenPilotReadinessCheck" } }
        claim: { $ref: "#/components/schemas/OpenPilotInboxClaim" }
        links:
          type: object
          properties:
            issue: { type: string }
            pull_request: { type: string }
            run: { type: string }
            state: { type: string }
            readiness: { type: string }
          required: [readiness]
      required: [key, repo, repository_id, executor_generation, issue, labels, assignees, source, pickup, bot_assigned, labels_satisfied, missing_labels, spec_required, spec_ready, eligible, action, reason_codes, checks, links]
    OpenPilotInboxReport:
      type: object
      properties:
        checked_at: { type: string, format: date-time }
        activation_mode: { type: string }
        upstream: { type: string, enum: [available, partial, unavailable, not_queried] }
        upstream_error: { type: string }
        policy:
          type: object
          properties:
            required_labels: { type: array, items: { type: string } }
            assignee: { type: string }
            require_issue_spec: { type: boolean }
            poll_repositories: { type: array, items: { type: string } }
        repositories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              executor_generation: { type: string }
              admitted: { type: boolean }
              admission_code: { type: string }
              admission_message: { type: string }
              polled: { type: boolean, description: True when OPEN_PILOT_POLL_REPOS includes the repository }
              upstream: { type: string, enum: [listed, unavailable, not_queried] }
              upstream_error: { type: string }
              listed: { type: integer }
              claims: { type: integer }
        issues: { type: array, items: { $ref: "#/components/schemas/OpenPilotInboxIssue" } }
        filter: { type: object }
        matched: { type: integer, description: Issues matching the filter before pagination }
        has_more: { type: boolean }
        next_cursor: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/OpenPilotReadinessCheck" } }
        blockers: { type: array, items: { type: string } }
      required: [checked_at, upstream, policy, repositories, issues, filter, matched, has_more, checks, blockers]
    OpenPilotReadinessReport:
      type: object
      properties:
        ready: { type: boolean, description: True when no check has status fail }
        checked_at: { type: string, format: date-time }
        activation_mode: { type: string }
        registry_generation: { type: string }
        registry_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        repositories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              aliases: { type: array, items: { type: string } }
              executor_generation: { type: string }
        target:
          type: object
          properties:
            repo: { type: string }
            issue: { type: string }
            repository_id: { type: string }
            repository_slug: { type: string }
            executor_generation: { type: string }
            canonical_issue: { type: string }
            registered: { type: boolean }
        rollout:
          type: object
          properties:
            mode: { type: string }
            registry_fingerprint: { type: string }
            fingerprint_matches: { type: boolean }
            proof_targets: { type: array, items: { $ref: "#/components/schemas/OpenPilotProofTarget" } }
            expires_at: { type: string, format: date-time }
            closed_reason: { type: string }
            generation: { type: integer }
        executors:
          type: array
          description: Per-repository OpenCode and verifier health for the resolved target (or every repository when no repo is given)
          items: { type: object }
        gates:
          type: object
          properties:
            autonomy_mode: { type: string }
            gitea_write_mode: { type: string }
            git_push_mode: { type: string }
            auto_commit_mode: { type: string }
            ci_check_mode: { type: string }
            ci_required_checks: { type: array, items: { type: string } }
            ci_auto_repair_mode: { type: string }
            merge_mode: { type: string }
            close_issue_mode: { type: string }
            worktree_mode: { type: string }
            command_policy_mode: { type: string }
            known: { type: boolean }
        command:
          type: object
          properties:
            command: { type: string }
            allowed: { type: boolean }
            dry_run: { type: boolean }
            reason: { type: string }
        issue_state:
          type: object
          properties:
            phase: { type: string }
            run_id: { type: string }
            next_action: { type: string }
            active_run: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/OpenPilotReadinessCheck" }
        blockers:
          type: array
          description: Codes of every failing check, in check order
          items: { type: string }
        onboarding:
          type: array
          items:
            type: object
            properties:
              step: { type: string }
              done: { type: boolean }
              detail: { type: string }
      required: [ready, checked_at, activation_mode, repositories, executors, gates, checks, blockers, onboarding]
    OpenPilotConfigurationDryRunInput:
      type: object
      additionalProperties: false
      description: Exactly one of registry (operator registry v1) or manifest (runtime manifest v1)
      properties:
        registry: { type: object }
        manifest: { type: object }
    OpenPilotConfigurationDryRunReport:
      type: object
      properties:
        valid: { type: boolean }
        kind: { type: string, enum: [operator-registry, runtime-manifest, ""] }
        checked_at: { type: string, format: date-time }
        generation: { type: string }
        fingerprint: { type: string }
        runtime_fingerprint: { type: string }
        runtime_fingerprint_matches: { type: boolean }
        repositories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              executor_generation: { type: string }
              runtime_match: { type: string, enum: [exact, generation-differs, slug-differs, unregistered, unknown] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/OpenPilotReadinessCheck" }
        blockers: { type: array, items: { type: string } }
      required: [valid, kind, checked_at, repositories, checks, blockers]
    ConfigureOpenPilotRollout:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [disabled, proof, allow] }
        registry_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        proof_targets:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/OpenPilotProofTarget" }
        expires_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 512 }
      required: [mode, registry_fingerprint]
    OpenPilotIssueState:
      type: object
      properties:
        id: { type: string }
        repo: { type: string }
        issue: { type: string }
        repository_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
        executor_generation: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
        canonical_repo: { type: string }
        canonical_issue: { type: string }
        legacy_repo: { type: string }
        legacy_issue: { type: string }
        phase: { type: string }
        run_id: { type: string }
        last_step_name: { type: string }
        branch: { type: string }
        base: { type: string }
        worktree_path: { type: string }
        pull_request_url: { type: string }
        pull_request_id: { type: integer }
        pull_request_number: { type: integer }
        merge_commit_sha: { type: string }
        issue_closed: { type: boolean }
        gate_status: { $ref: "#/components/schemas/OpenPilotGateStatus" }
        resume_inputs: { $ref: "#/components/schemas/StringMap" }
        repair_attempts: { type: integer }
        max_repair_attempts: { type: integer }
        last_error: { type: string }
        failing_gate: { type: string }
        operator_summary: { type: string }
        recommended_next_action: { type: string }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, repo, issue, phase, issue_closed, repair_attempts, max_repair_attempts, updated_at, created_at]
    ModelBrokerStatus:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [healthy, degraded, unknown, unreachable, failed, not_configured] }
        configured: { type: boolean }
        backend: { type: string }
        transitional_backend: { type: string }
        effective_selector: { type: string, description: Effective request route; native when selectors are unset or unknown. }
        configured_selector: { type: string }
        compatibility_warning: { type: string, example: deprecated-external-backend }
        base_url: { type: string }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        active_request: { type: boolean }
        connected_clients: { type: integer }
        in_flight_request_ids:
          type: array
          items: { type: string }
        upstreams:
          type: array
          items: { $ref: "#/components/schemas/ModelBrokerStatusUpstream" }
        checked_at: { type: string, format: date-time }
        error: { type: string }
      required: [id, status, configured, backend, effective_selector, queue_depth, max_depth, active_request, connected_clients, in_flight_request_ids, upstreams, checked_at]
    ModelRequest:
      type: object
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ModelRequestStatus" }
        model: { type: string }
        path: { type: string }
        client: { type: string }
        client_priority: { type: integer }
        request_body: { type: string }
        response_body: { type: string }
        error: { type: string }
        correlation_ids:
          type: object
          additionalProperties: { type: string }
          description: Includes bounded audit_action, audit_actor, and audit_reason evidence for operator mutations.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancel_requested_at: { type: string, format: date-time }
      required: [id, status, model, path, client, client_priority, created_at, updated_at]
    ModelRequestStatus:
      type: string
      enum: [queued, running, cancel_requested, canceled, completed, failed, dropped]
    ModelQueue:
      type: object
      properties:
        queued: { type: integer, minimum: 0, description: Exact queued request count. }
        running: { type: integer, minimum: 0, description: Exact running request count. }
        cancel_requested: { type: integer, minimum: 0, description: Exact cancel-requested count. }
        max_depth: { type: integer, minimum: 1 }
        in_flight_request_ids:
          type: array
          maxItems: 100
          items: { type: string }
          description: Bounded sample of running and cancel-requested IDs.
      required: [queued, running, cancel_requested, max_depth, in_flight_request_ids]
    ModelQueueEnvelope:
      type: object
      properties:
        queue: { $ref: "#/components/schemas/ModelQueue" }
      required: [queue]
    ModelRequestEnvelope:
      type: object
      properties:
        request: { $ref: "#/components/schemas/ModelRequest" }
      required: [request]
    ModelRequestListEnvelope:
      type: object
      properties:
        requests: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ModelRequest" } }
      required: [requests]
    ModelMutationEnvelope:
      type: object
      properties:
        actor: { type: string, maxLength: 256 }
        request: { $ref: "#/components/schemas/ModelRequest" }
      required: [actor, request]
    ModelBulkMutationEnvelope:
      type: object
      properties:
        actor: { type: string, maxLength: 256 }
        canceled: { type: integer, minimum: 0 }
        requests: { type: array, items: { $ref: "#/components/schemas/ModelRequest" } }
      required: [actor, canceled, requests]
    CompatBrokerStatus:
      type: object
      properties:
        status: { type: string }
        backend: { type: string, enum: [switchyard-native] }
        effective_selector: { type: string, description: Effective request route; native when selectors are unset or unknown. }
        configured_selector: { type: string, description: Explicit MODEL_BROKER_BACKEND value when set. }
        compatibility_warning: { type: string, example: deprecated-external-backend }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        active_request: { type: boolean }
        connected_clients: { type: integer }
        in_flight_ids: { type: array, items: { type: string } }
        queue: { type: array, items: { type: object } }
        inflight: { type: array, items: { type: object } }
        upstreams: { type: array, items: { $ref: "#/components/schemas/ModelBrokerStatusUpstream" } }
        checked_at: { type: string, format: date-time }
        error: { type: string }
      required: [status, backend, effective_selector, queue_depth, max_depth, active_request, connected_clients, in_flight_ids, queue, inflight, upstreams, checked_at]
    ModelBrokerStatusUpstream:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [healthy, failed, unknown] }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        in_flight_id: { type: string }
        last_probe_at: { type: string, format: date-time }
      required: [name, url, status, queue_depth, max_depth]
    OpenCodeExecutorStatus:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [healthy, degraded, unreachable, failed, not_configured] }
        configured: { type: boolean }
        backend: { type: string }
        transitional_backend: { type: string }
        configured_selector: { type: string }
        compatibility_warning: { type: string, example: deprecated-external-backend }
        base_url: { type: string }
        healthy: { type: boolean }
        session_count: { type: integer }
        active_session_count: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/OpenCodeExecutorStatusSession" }
        checked_at: { type: string, format: date-time }
        error: { type: string }
      required: [id, status, configured, backend, healthy, session_count, active_session_count, sessions, checked_at]
    OpenCodeExecutorStatusSession:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        version: { type: integer, minimum: 1, readOnly: true }
        user: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, title, status]
    Workflow:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        description: { type: string }
        owns: { type: array, items: { type: string } }
        uses: { type: array, items: { type: string } }
        status: { type: string }
      required: [id, kind, name, description, owns, uses, status]
    JSONShape:
      type: object
      properties:
        type: { type: string }
        description: { type: string }
        properties:
          type: object
          additionalProperties: { $ref: "#/components/schemas/JSONShapeProperty" }
        required:
          type: array
          items: { type: string }
      required: [type]
    JSONShapeProperty:
      type: object
      description: Property schema. Input shapes use `type` and `description`. Step output contracts also accept `properties`, `required`, `items`, `maxLength`, `maxItems`, and `enum`; see `StepOutputShape`.
      properties:
        type: { type: string, enum: [string, number, integer, boolean, object, array] }
        description: { type: string }
        properties:
          type: object
          additionalProperties: { $ref: "#/components/schemas/JSONShapeProperty" }
          description: Child properties; `type` must be `object`.
        required:
          type: array
          items: { type: string }
          description: Required child property names; each must be declared in `properties`.
        items:
          allOf: [{ $ref: "#/components/schemas/JSONShapeProperty" }]
          description: Element schema; `type` must be `array`.
        maxLength: { type: integer, minimum: 0, maximum: 1048576, description: "Maximum Unicode code points; `type` must be `string`." }
        maxItems: { type: integer, minimum: 0, maximum: 1048576, description: "Maximum array length; `type` must be `array`." }
        enum:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 1024 }
          description: Allowed values; `type` must be `string`.
      required: [type]
    StepOutputShape:
      type: object
      description: >-
        Step output contract (version 1). Describes the map of named string outputs, so `type` must be `object`.
        Top-level property names follow the step output name rules and at most 32 are declared. A top-level
        `string` output is the raw text; `number`, `integer`, `boolean`, `object`, and `array` outputs must be
        JSON text of that type. Nesting is limited to 8 levels and 256 schema nodes. Other keywords
        (`$ref`, `pattern`, `format`, `additionalProperties`, `oneOf`, ...) are rejected. Undeclared outputs are
        not validated.
      additionalProperties: false
      properties:
        type: { type: string, enum: [object] }
        description: { type: string }
        properties:
          type: object
          maxProperties: 32
          additionalProperties: { $ref: "#/components/schemas/JSONShapeProperty" }
        required:
          type: array
          items: { type: string }
      required: [type]
    StepOutputContract:
      type: object
      description: Versioned output contract copied from a definition step `output_shape` into the immutable run pipeline snapshot. Retries, resumes, and definition rollbacks keep validating against it.
      properties:
        version: { type: integer, enum: [1] }
        shape: { $ref: "#/components/schemas/StepOutputShape" }
      required: [version, shape]
    PipelineStepDefinition:
      type: object
      properties:
        id: { type: string }
        position: { type: integer }
        name: { type: string }
        executor: { type: string }
        profile: { type: string }
        model: { type: string }
        inputs: { $ref: "#/components/schemas/StringMap" }
        output_shape:
          allOf: [{ $ref: "#/components/schemas/StepOutputShape" }]
          description: Optional output contract. Omit it to leave outputs unvalidated. See docs/reference/step-outputs.md.
      required: [id, position, name, executor]
    PipelineDefinition:
      type: object
      properties:
        id: { type: string }
        workflow_id: { type: string }
        name: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/PipelineStepDefinition" }
      required: [id, name, steps]
    WorkflowDefinition:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        owns:
          type: array
          items: { type: string }
        uses:
          type: array
          items: { type: string }
        input_shape: { $ref: "#/components/schemas/JSONShape" }
        pipeline: { $ref: "#/components/schemas/PipelineDefinition" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [id, name, status, version, pipeline]
    WorkflowDefinitionUpsertRequest:
      type: object
      description: Request body for creating an immutable draft version. The path ID is authoritative; activate through the dedicated action after validation.
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft] }
        owns:
          type: array
          items: { type: string }
        uses:
          type: array
          items: { type: string }
        input_shape: { $ref: "#/components/schemas/JSONShape" }
        pipeline: { $ref: "#/components/schemas/PipelineDefinition" }
      required: [name, pipeline]
    Trigger:
      type: object
      properties:
        id: { type: string }
        workflow_id: { type: string }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        schedule: { type: string }
        inputs: { $ref: "#/components/schemas/StringMap" }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_error: { type: string }
        timezone: { type: string }
        missed_run_policy: { type: string, enum: [coalesce_once] }
      required: [id, workflow_id, type, name, description, enabled]
    Run:
      type: object
      properties:
        id: { type: string }
        workflow_id: { type: string }
        trigger_id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled, paused, timed_out] }
        inputs: { $ref: "#/components/schemas/StringMap" }
        created_at: { type: string, format: date-time }
        queued_at: { type: string, format: date-time }
        available_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time }
        claimed_by: { type: string }
        lease_expires_at: { type: string, format: date-time }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        summary: { type: string }
        pipeline_id: { type: string }
        pipeline_version: { type: string, description: Stable hash of the immutable pipeline snapshot used by this run. }
      required: [id, workflow_id, status, created_at, queued_at, available_at, attempt_count, max_attempts]
    RunStep:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        position: { type: integer }
        name: { type: string }
        executor: { type: string }
        model: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled, timed_out, paused] }
        inputs: { $ref: "#/components/schemas/StringMap" }
        outputs:
          allOf: [{ $ref: "#/components/schemas/StringMap" }]
          description: Durable named outputs published by a succeeded step. Later steps bind them with `{{steps.<step_id>.outputs.<name>}}`; values are bounded by `SWITCHYARD_MAX_STEP_OUTPUT_BYTES` and credential-shaped names are never persisted. Steps with an output contract persist outputs only after they satisfy it. See docs/reference/step-outputs.md.
        output_summary: { type: string }
        error: { type: string }
        attempt_count: { type: integer }
        correlation_ids: { $ref: "#/components/schemas/StringMap" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
      required: [id, run_id, position, name, executor, status, attempt_count, created_at]
    RunEvent:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        type: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, run_id, type, message, created_at]
    Artifact:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        name: { type: string }
        kind: { type: string }
        uri: { type: string }
        storage_class: { type: string, enum: [inline-data-uri, legacy-inline] }
        content_type: { type: string }
        byte_size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        retention_until: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, run_id, name, kind, uri, storage_class, byte_size, created_at]
    RunDetail:
      type: object
      properties:
        run: { $ref: "#/components/schemas/Run" }
        steps: { type: array, items: { $ref: "#/components/schemas/RunStep" } }
        events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
      required: [run, steps, events, artifacts]
    CreateRunInput:
      type: object
      properties:
        workflow_id: { type: string }
        trigger_id: { type: string }
        inputs: { $ref: "#/components/schemas/StringMap" }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
      required: [workflow_id]
    Pipeline:
      type: object
      properties:
        id: { type: string }
        workflow_id: { type: string }
        name: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/PipelineStep" }
      required: [id, workflow_id, name, description, steps]
    PipelineStep:
      type: object
      properties:
        id: { type: string }
        position: { type: integer }
        name: { type: string }
        executor: { type: string }
        profile: { type: string }
        model: { type: string }
        inputs: { $ref: "#/components/schemas/StringMap" }
        output_contract: { $ref: "#/components/schemas/StepOutputContract" }
      required: [id, position, name, executor]
    AgentProfile:
      type: object
      description: Effective agent-profile policy. Static defaults report `version` 0, `status` `static`, and `source` `static`; persisted versions report their immutable version number, lifecycle status, and provenance.
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        default_model: { type: string }
        allowed_models:
          type: array
          items: { type: string }
          description: Optional closed model list. Empty means the executor's own model policy applies.
        prompt_contract: { type: string }
        allowed_executors: { type: array, items: { type: string, enum: [internal, model, opencode, command, http, git, gitea] } }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [static, draft, active, superseded] }
        source: { type: string, enum: [static, persisted] }
        prompt_contract_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        provenance: { $ref: "#/components/schemas/AgentProfileProvenance" }
      required: [id, name, role, default_model, prompt_contract, allowed_executors, version, status, source, prompt_contract_sha256]
    AgentProfileProvenance:
      type: object
      properties:
        origin: { type: string, enum: [static-default, operator, rollback] }
        actor: { type: string }
        note: { type: string }
        derived_from_version: { type: integer, minimum: 0 }
        rolled_back_from_version: { type: integer, minimum: 0 }
        static_contract_sha256: { type: string, description: Prompt-contract hash of the shipped default when the version was written. }
      required: [origin]
    AgentProfileVersion:
      allOf:
        - $ref: "#/components/schemas/AgentProfile"
        - type: object
          properties:
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
            activated_at: { type: string, format: date-time, readOnly: true }
          required: [created_at, updated_at]
    AgentProfileIdentity:
      type: object
      description: Stable identity record. `active_version` 0 means the shipped static default serves requests; `draft_version` 0 means no unactivated draft exists.
      properties:
        id: { type: string }
        active_version: { type: integer, minimum: 0 }
        draft_version: { type: integer, minimum: 0 }
        latest_version: { type: integer, minimum: 0 }
        static_default: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [id, active_version, draft_version, latest_version, static_default]
    AgentProfileDraftRequest:
      type: object
      description: Creates a new immutable draft version. The path ID is authoritative and must match `^[a-z0-9][a-z0-9-]{0,63}$`. Unknown fields are rejected.
      properties:
        expected_version: { type: integer, minimum: 0, description: Must equal the identity's latest_version (0 when nothing is persisted yet). }
        name: { type: string, maxLength: 128 }
        role: { type: string, maxLength: 128 }
        default_model: { type: string, maxLength: 128 }
        allowed_models: { type: array, items: { type: string, maxLength: 128 } }
        allowed_executors: { type: array, minItems: 1, items: { type: string, enum: [internal, model, opencode, command, http, git, gitea] } }
        prompt_contract: { type: string, maxLength: 16384 }
        note: { type: string, maxLength: 1024 }
      required: [expected_version, name, role, allowed_executors, prompt_contract]
    AgentProfileActivationRequest:
      type: object
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 1024 }
      required: [version]
    AgentProfileTransitionResponse:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/AgentProfile" }
        profile_version: { $ref: "#/components/schemas/AgentProfileVersion" }
        identity: { $ref: "#/components/schemas/AgentProfileIdentity" }
        rolled_back_from_version: { type: integer, minimum: 1 }
      required: [profile, profile_version, identity]
    AgentProfileAuditEntry:
      type: object
      properties:
        id: { type: string }
        profile_id: { type: string }
        version: { type: integer, minimum: 1 }
        action: { type: string, enum: [draft-saved, activated, rolled-back] }
        actor: { type: string }
        reason: { type: string }
        prompt_contract_sha256: { type: string }
        previous_active_version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
      required: [id, profile_id, version, action, actor, prompt_contract_sha256, previous_active_version, created_at]
    SchedulerStatus:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        paused: { type: boolean, description: Runtime dispatch pause; process-local and reset on restart }
        interval: { type: string }
        last_tick: { type: string, format: date-time }
        last_error: { type: string }
      required: [enabled, running]
    WorkerPoolStatus:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        paused: { type: boolean, description: Runtime claim pause; process-local and reset on restart }
        workers: { type: integer }
        active: { type: integer }
        lease: { type: string }
        poll_interval: { type: string }
        last_recover_at: { type: string, format: date-time }
        recovered_runs: { type: integer }
        failed_leases: { type: integer }
        completed_runs: { type: integer }
        failed_runs: { type: integer }
        lease_renewals: { type: integer }
        last_error: { type: string }
      required: [enabled, running]
    OperatorSafetyStatus:
      type: object
      properties:
        public_url: { type: string }
        reverse_proxy_auth: { type: boolean }
        open_pilot_autonomy_mode: { type: string }
        correlation_targets:
          type: object
          description: Sanitized external bases (scheme, host, path only) the dashboard may link run correlations to. Absent values disable those links.
          properties:
            gitea_base_url: { type: string, description: "Sanitized GITEA_BASE_URL for issue, pull request, commit, and CI links." }
            trace_ui_base_url: { type: string, description: "Sanitized SWITCHYARD_TRACE_UI_URL; may contain a literal {trace_id} placeholder." }
        warnings: { type: array, items: { type: string } }
      required: [reverse_proxy_auth, open_pilot_autonomy_mode, correlation_targets, warnings]
    RuntimeConfigSetting:
      type: object
      description: One inventoried setting. Secret-classified settings never carry effective, default, compose_default, or example_default.
      properties:
        key: { type: string }
        component: { type: string }
        kind: { type: string }
        sensitivity: { type: string, enum: [public, internal, secret] }
        mutability: { type: string, enum: [file-managed, runtime-mutable] }
        restart: { type: string, enum: [api, opencode, compose, none] }
        authorization: { type: string, enum: [host-operator, admin] }
        description: { type: string }
        source: { type: string, enum: [environment, default, unset, runtime, unavailable, not-observable] }
        effective: { type: string }
        configured: { type: boolean }
        default: { type: string }
        compose_default: { type: string }
        example_default: { type: string }
        deployment_override: { type: string }
        overridden: { type: boolean }
        available: { type: boolean }
        instructions: { type: string }
      required: [key, component, kind, sensitivity, mutability, restart, authorization, description, source, instructions]
    RuntimeSettingChange:
      type: object
      properties:
        revision: { type: integer, minimum: 1 }
        key: { type: string }
        previous: { type: string }
        value: { type: string }
        actor: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }
      required: [revision, key, previous, value, actor, at]
    RuntimeConfigResponse:
      type: object
      properties:
        contract_version: { type: integer, enum: [1] }
        revision: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
        settings: { type: array, items: { $ref: "#/components/schemas/RuntimeConfigSetting" } }
        changes: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RuntimeSettingChange" } }
      required: [contract_version, revision, generated_at, settings, changes]
    RuntimeConfigChangeRequest:
      type: object
      additionalProperties: false
      properties:
        value: { type: boolean }
        expected_revision: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 256 }
      required: [value, expected_revision]
    RuntimeConfigChangeResponse:
      type: object
      properties:
        setting: { $ref: "#/components/schemas/RuntimeConfigSetting" }
        revision: { type: integer, minimum: 1 }
        change: { $ref: "#/components/schemas/RuntimeSettingChange" }
      required: [setting, revision, change]
    RuntimeConfigConflict:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [file-managed, unavailable, stale-revision] }
