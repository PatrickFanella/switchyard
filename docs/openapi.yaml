openapi: 3.1.0
info:
  title: Switchyard Control Plane API
  version: 0.1.0
  description: >-
    Local control-plane API for workflows, runs, triggers, pipelines, workers,
    adapter status, and compatibility ingress. Switchyard also exposes
    llama-line/Ollama-compatible model endpoints on LLAMA_LINE_PORT:
    /broker/status, /v1/chat/completions, /api/chat, /api/generate, /api/tags,
    /v1/models, /api/embed, and /v1/embeddings. Admin queue/inflight and durable
    history/search/log/config compatibility surfaces remain on the authenticated
    control listener and are excluded from model ingress. Compatibility routes
    preserve llama-line/OCQ correlation
    headers (`X-Request-ID`, `X-Llama-Line-Request-ID`, `X-OCQ-Request-ID`,
    `X-OCQ-Session` when available) and serves OpenAI streaming requests as
    native SSE chunks when upstream streaming is available, with buffered
    fallback and queued/running/completed status events. Native broker calls route
    to OpenCode by default and to upstream Ollama when OLLAMA_BASE_URL is
    configured and the model is local or prefixed with ollama/. Requests may be
    submitted durably with `Prefer: respond-async` or `?async=true` and polled at
    `/api/requests/{id}/result`; queued jobs are recovered on API startup. On
    the control-plane listener every non-health request requires an admin or
    read-only bearer token, or an identity asserted by an explicitly trusted
    authenticated reverse proxy. Mutating requests require the admin role. On
    the control listener, HEAD is supported as the bodyless alias of every GET
    operation available on that listener and uses the same read authentication.
servers:
  - url: http://127.0.0.1:18080
    description: Local control API (default API_PORT)
security:
  - controlPlaneBearer: []
x-switchyard-method-aliases:
  - listener: control
    source: GET
    alias: HEAD
    scope: all operations available on the control listener
paths:
  /api/model-broker/queue:
    get:
      summary: Get native model queue health
      responses:
        "200":
          description: Exact queue counts with a bounded in-flight ID sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelQueueEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests:
    get:
      summary: List native model requests
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: status, in: query, schema: {type: string}}
        - {name: before, in: query, schema: {type: string}}
      responses:
        "200":
          description: Bounded request list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRequestListEnvelope" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel all queued and running model requests
      responses:
        "200":
          description: Cancellation result with authenticated actor evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelBulkMutationEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a native model request
      responses:
        "200":
          description: Model request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRequestEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Cancel a native model request
      responses:
        "200":
          description: Cancellation state with authenticated actor evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelMutationEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}/drop:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Drop a native model request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 256}
      responses:
        "200":
          description: Dropped request with authenticated actor and reason evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelMutationEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /health:
    get:
      security: []
      summary: Compatibility health check
      responses: { "200": { description: API is healthy } }
  /healthz:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /readyz:
    get:
      security: []
      summary: Storage-backed readiness check
      responses:
        "200": { description: API and persistence are ready }
        "503": { description: Persistence is unavailable }
  /broker/status:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Llama-line-compatible broker status
      description: Cutover endpoint served on LLAMA_LINE_PORT; includes native queue/inflight state and upstream health.
      responses:
        "200":
          description: Broker status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatBrokerStatus"
  /v1/chat/completions:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible chat completion
      description: Native Ollama vision routes accept OpenAI content-part arrays with inline base64 data:image image_url values; remote image URLs are rejected.
      responses:
        "200":
          description: Completion or SSE stream
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /v1/completions:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible text completion
      responses:
        "200":
          description: Completion
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /v1/embeddings:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible embeddings
      responses: { "200": { description: Embeddings } }
  /v1/models:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible model list
      responses: { "200": { description: Model list } }
  /api/chat:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible chat
      responses:
        "200":
          description: Chat response
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /api/generate:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible generation
      responses:
        "200":
          description: Generation response
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /api/embed:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible embeddings alias
      responses: { "200": { description: Embeddings } }
  /api/embeddings:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible embeddings
      responses: { "200": { description: Embeddings } }
  /api/tags:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible model tags
      responses: { "200": { description: Model list } }
  /metrics:
    get:
      summary: Prometheus runtime metrics
      description: >-
        Authenticated control-listener metrics. The public model-listener
        operation is specified in docs/openapi-model-ingress.yaml.
      servers: [{url: "http://127.0.0.1:18080", description: Authenticated control listener (default API_PORT)}]
      responses: { "200": { description: Prometheus text exposition } }
  /api/observability/model-broker:
    get:
      summary: Model broker latency, errors, and recent requests
      responses: { "200": { description: Model broker observability summary } }
  /admin/queue:
    get:
      summary: List queued compatibility requests
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema: { type: object }
    delete:
      summary: Cancel all queued and inflight compatibility requests
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { type: object }
  /admin/queue/{id}:
    delete:
      summary: Cancel one compatibility request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Request canceled }
        "404": { description: Request not found }
  /admin/inflight:
    get:
      summary: List inflight compatibility requests
      responses:
        "200":
          description: Inflight snapshot
          content:
            application/json:
              schema: { type: object }
  /admin/inflight/cancel:
    post:
      summary: Cancel inflight compatibility requests
      description: Cancels a specific request when `id` or `request_id` is supplied; otherwise cancels all tracked requests.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                request_id: { type: string }
      responses:
        "202": { description: Cancellation accepted }
        "404": { description: Request not found }
  /admin/logs:
    get:
      summary: Legacy llama-line admin logs alias
      description: Alias of `/api/logs`; backed by the durable model broker ledger.
      responses:
        "200": { description: Log entries }
  /admin/logs/recent:
    get:
      summary: Legacy llama-line recent logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /admin/audit:
    get:
      summary: Legacy llama-line audit alias
      description: Audit-style view derived from durable model broker requests.
      responses:
        "200": { description: Audit entries }
  /admin/audit/recent:
    get:
      summary: Legacy llama-line recent audit alias
      description: Alias of `/admin/audit`.
      responses:
        "200": { description: Audit entries }
  /admin/search:
    get:
      summary: Legacy llama-line admin search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /admin/stats/summary:
    get:
      summary: Legacy llama-line stats summary alias
      description: Summarizes request counts, model counts, queue depth, and inflight depth from native state.
      responses:
        "200": { description: Stats summary }
  /admin/feedback:
    get:
      summary: List persisted model feedback
      responses:
        "200": { description: Persisted feedback list }
    post:
      summary: Persist model feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: { type: string }
                rating: { type: integer, minimum: -1, maximum: 1 }
                comment: { type: string, maxLength: 4096 }
              required: [request_id, rating]
      responses:
        "201": { description: Feedback persisted }
  /ui/:
    get:
      summary: Lightweight legacy broker UI landing page
      responses:
        "200": { description: HTML compatibility page }
  /ui/api/status:
    get:
      summary: Legacy UI status alias
      description: Alias of `/broker/status`.
      responses:
        "200": { description: Broker status }
  /ui/api/history:
    get:
      summary: Legacy UI history alias
      description: Alias of `/api/history`.
      responses:
        "200": { description: Request history }
  /ui/api/logs:
    get:
      summary: Legacy UI logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /ui/api/search:
    get:
      summary: Legacy UI search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /ui/api/config:
    get:
      summary: Legacy UI config alias
      description: Alias of `/api/config`.
      responses:
        "200": { description: Compatibility config }
  /api/history:
    get:
      summary: List durable model broker request history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Request history
          content:
            application/json:
              schema: { type: object }
  /api/history/{id}:
    get:
      summary: Get one durable model broker request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /api/search:
    get:
      summary: Search durable model broker requests
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { type: object }
  /api/logs:
    get:
      summary: Return request-log view backed by the durable model broker ledger
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema: { type: object }
  /api/config:
    get:
      summary: Return native model broker compatibility configuration
      responses:
        "200":
          description: Compatibility config
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_broker_selector: { type: string, description: Effective selector; native when unset. }
                  opencode_executor_selector: { type: string, description: Effective selector; native when unset. }
                  model_broker_configured_selector: { type: string, description: Explicit MODEL_BROKER_BACKEND value, when configured. }
                  opencode_executor_configured_selector: { type: string, description: Explicit OPENCODE_EXECUTOR_BACKEND value, when configured. }
                  compatibility_warning: { type: string, description: Present only when a deprecated external selector is active. }
  /api/requests/{id}/result:
    get:
      summary: Poll a durable model broker request result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Result is available }
        "202": { description: Request is queued, running, or cancel-requested }
        "410": { description: Request was canceled }
        "502": { description: Request failed upstream }
  /ocq/sessions:
    get:
      summary: OCQ-compatible native OpenCode session list
      responses:
        "200": { description: Session list }
  /ocq/sessions/{id}:
    get:
      summary: OCQ-compatible native OpenCode session detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session detail }
        "404": { description: Session not found }
  /ocq/sessions/{session}/messages/{id}/abort:
    post:
      summary: OCQ-compatible message abort alias
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
  /ocq/requests:
    get:
      summary: OCQ-compatible request list backed by the model broker ledger
      responses:
        "200": { description: Request list }
  /ocq/requests/{id}:
    get:
      summary: OCQ-compatible request detail backed by the model broker ledger
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /ocq/requests/{id}/abort:
    post:
      summary: OCQ-compatible request abort alias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
        "404": { description: Request not found }
  /ocq/settings:
    get:
      summary: OCQ-compatible native executor settings
      responses:
        "200": { description: Executor settings }
  /ocq/audit:
    get:
      summary: OCQ-compatible audit alias
      description: Alias of the native compatibility audit view.
      responses:
        "200": { description: Audit entries }
  /ocq/logs:
    get:
      summary: OCQ-compatible logs alias
      description: Alias of the native compatibility logs view.
      responses:
        "200": { description: Log entries }
  /api/adapters:
    get:
      summary: List adapter snapshots
      responses:
        "200": { $ref: "#/components/responses/AdapterPayload" }
  /api/models:
    get:
      summary: List available model inventory
      description: Reports installed Ollama models plus OpenCode provider/model metadata when those upstreams are configured.
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  ollama:
                    type: object
                    properties:
                      configured: { type: boolean }
                      base_url: { type: string }
                      status: { type: string }
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            provider: { type: string }
                  opencode:
                    type: object
                    properties:
                      configured: { type: boolean }
                      base_url: { type: string }
                      status: { type: string }
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            provider: { type: string }
                  checked_at: { type: string, format: date-time }
  /api/models/pull:
    post:
      summary: Pull Ollama models through the configured upstream
      description: Pulls one or more Ollama models via upstream `/api/pull` with `stream:false`. OpenCode model downloads are not supported because OpenCode only refreshes provider metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [ollama] }
                models:
                  type: array
                  items: { type: string }
              required: [models]
      responses:
        "200": { description: Pull results }
        "400": { description: Invalid provider or model list }
        "502": { description: Ollama pull failed }
  /api/model-broker/status:
    get:
      summary: Get native ModelBroker status
      description: Reports Switchyard's native model-broker surface. llama-line-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/ModelBrokerStatusResponse" }
  /api/opencode-executor/status:
    get:
      summary: Get native OpenCodeExecutor status
      description: Reports Switchyard's native OpenCode executor surface. OCQ-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/OpenCodeExecutorStatusResponse" }
  /api/scheduler:
    get:
      summary: Get scheduler status
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerStatus" }
  /api/workers:
    get:
      summary: Get worker pool status
      responses:
        "200":
          description: Worker pool status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPoolStatus" }
  /api/retention:
    get:
      summary: Get retention manager status and last prune counts
      responses:
        "200": { description: Retention status }
  /api/artifacts/report:
    get:
      summary: Get bounded inline artifact storage measurements
      description: >-
        Returns retained inline data URI volume, durable created and pruned totals,
        and bounded UTC daily buckets. retention_until is declared metadata;
        actual deletion follows terminal run retention.
      parameters:
        - name: days
          in: query
          description: Number of UTC daily buckets ending today.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Bounded artifact report
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_report: { $ref: "#/components/schemas/ArtifactReport" }
                required: [artifact_report]
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/evidence/search:
    get:
      summary: Search retained runs, steps, and model requests
      description: >-
        Bounded, authenticated native search over retained Switchyard evidence.
        Matching is a case-insensitive substring test over identifiers, names,
        statuses, summaries, errors, and correlation-ID values only. Run inputs,
        step inputs, and model request/response bodies are never matched or
        returned, and every returned text field is redacted and capped at 512
        characters. Only records created within the configured retention
        window (SWITCHYARD_RETENTION, default 720h) are searchable; the
        response states the exact floor. Results are ordered by
        (created_at desc, kind desc, id desc) and paginated with an opaque
        keyset cursor, so pages stay stable while new evidence arrives.
        Read-only tokens may call this route. The model-ingress listener does
        not expose it.
      parameters:
        - name: q
          in: query
          description: Substring query; empty lists the most recent evidence in scope.
          schema: { type: string, maxLength: 256 }
        - name: scope
          in: query
          description: >-
            all searches runs, steps, and requests. runs, steps, and requests
            restrict to one kind. errors restricts to failed or timed-out runs,
            steps with an error or failed/timed-out status, and failed or
            errored requests. correlations matches only step and request
            identifiers, step run IDs, and correlation-ID values.
          schema: { type: string, enum: [all, runs, steps, requests, errors, correlations], default: all }
        - name: status
          in: query
          description: Exact, case-insensitive status filter.
          schema: { type: string, maxLength: 128 }
        - name: workflow
          in: query
          description: Restrict runs and steps to one workflow ID; requests carry no workflow and are excluded.
          schema: { type: string, maxLength: 128 }
        - name: run_id
          in: query
          description: Restrict to one run, its steps, and requests whose correlation IDs reference it.
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque next_cursor value from a previous page.
          schema: { type: string }
      responses:
        "200":
          description: One page of redacted evidence hits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSearchPage" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/compatibility/retirement:
    get:
      summary: Get durable deprecated-backend retirement status
      description: Aggregate-only UTC daily usage for deprecated llama-line and OCQ compatibility routes. A backend is eligible only after 90 days of zero attempts; two-release evidence remains an external qualification record.
      responses:
        "200":
          description: Compatibility retirement status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatibilityRetirementStatus" }
  /api/compatibility/report:
    get:
      summary: Generate canonical deprecated-backend observation evidence
      description: >-
        Returns canonical JSON only when every requested elapsed UTC day has a
        completed, revision-bound observation for both llama-line and OCQ.
        Missing rows are never interpreted as zero attempts.
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive UTC start date.
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          description: Inclusive elapsed UTC end date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Complete canonical compatibility observation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  compatibility_report: { $ref: "#/components/schemas/CompatibilityReport" }
                required: [compatibility_report]
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/compatibility/observer:
    get:
      summary: Get compatibility observer health and detected gaps
      responses:
        "200":
          description: Observer health, or disabled status
          content:
            application/json:
              schema: { type: object }
  /api/operator-safety:
    get:
      summary: Get operator safety status
      responses:
        "200":
          description: Operator safety status and warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSafetyStatus" }
  /api/control-access:
    get:
      summary: Get the caller's control-plane role
      description: |
        Control-listener-only. Reports whether the authenticated caller holds
        the admin or read role so the dashboard can render read-only screens
        before an edit. Advisory only: every non-GET request from a read-role
        caller is still rejected with 403. A handler served without the
        control-plane authentication layer reports role "unrestricted".
      responses:
        "200":
          description: Caller role and whether writes are allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, enum: [admin, read, unrestricted] }
                  can_write: { type: boolean }
                required: [role, can_write]
  /api/runtime-config:
    get:
      summary: Get the effective runtime configuration inventory
      description: |
        Control-listener-only view of every inventoried setting with its
        source of truth, sensitivity, mutability, restart requirement,
        authorization, effective value, and drift against the defaults
        contract. Secret-classified values are never returned; only whether
        they are configured. Compose-only and sidecar-only keys are reported
        as not observable. See docs/reference/runtime-configuration.md.
      responses:
        "200":
          description: Effective configuration, revision, and recent runtime changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfigResponse" }
  /api/runtime-config/{key}:
    put:
      summary: Change one runtime-mutable setting
      description: |
        Admin-only. Accepts only inventory keys classified runtime-mutable
        (scheduler.dispatch_paused and workers.claim_paused in v1). The
        request must carry the revision it observed; a mismatch is rejected
        as stale. File-managed keys are rejected with the exact file and
        restart instructions instead of being applied. Accepted changes are
        recorded in the bounded process-local change list and the log.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeConfigChangeRequest" }
      responses:
        "200":
          description: Change applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfigChangeResponse" }
        "400":
          description: Invalid body, missing expected_revision, or value of the wrong type
        "403":
          description: Caller is not an admin
        "404":
          description: Key is not inventoried
        "409":
          description: File-managed key, component unavailable, or stale revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfigConflict" }
  /api/operator-summary:
    get:
      summary: Get bounded Switchyard operator summary
      description: Returns the versioned read-only summary used by external operator surfaces.
      responses:
        "200":
          description: Current scheduler, worker, run, and component summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSummary" }
  /api/pipelines:
    get:
      summary: List pipeline definitions
      responses:
        "200":
          description: Pipeline list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
                required: [pipelines]
  /api/agent-profiles:
    get:
      summary: List effective agent profiles
      description: Returns the effective policy for every profile ID (active persisted version first, otherwise the shipped static default) plus the identity records of profiles that have persisted versions.
      responses:
        "200":
          description: Agent profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfile" }
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfileIdentity" }
                required: [profiles, identities]
  /api/agent-profiles/{id}:
    get:
      summary: Get the effective agent profile and its identity
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
      responses:
        "200":
          description: Effective profile and identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/AgentProfile" }
                  identity: { $ref: "#/components/schemas/AgentProfileIdentity" }
                required: [profile, identity]
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Save a new immutable draft version
      description: Admin only. `expected_version` must equal the identity's `latest_version` (0 for a profile that has never been persisted); a mismatch returns 409 so concurrent editors cannot overwrite each other. Saving supersedes any earlier unactivated draft. The body is validated against the closed executor set and model-name rules but not activated.
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileDraftRequest" }
      responses:
        "200":
          description: Saved draft version
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_version: { $ref: "#/components/schemas/AgentProfileVersion" }
                  identity: { $ref: "#/components/schemas/AgentProfileIdentity" }
                required: [profile_version, identity]
        default: { $ref: "#/components/responses/Error" }
  /api/agent-profiles/{id}/versions:
    get:
      summary: List immutable agent-profile versions, newest first
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
      responses:
        "200":
          description: Version history (empty for a profile that only has a static default)
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_versions:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfileVersion" }
                required: [profile_versions]
        default: { $ref: "#/components/responses/Error" }
  /api/agent-profiles/{id}/audit:
    get:
      summary: List the append-only agent-profile audit trail, newest first
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfileAuditEntry" }
                required: [audit]
        default: { $ref: "#/components/responses/Error" }
  /api/agent-profiles/{id}/activate:
    post:
      summary: Validate and activate a draft version
      description: Admin only. The version must currently be a draft (409 otherwise). Activation is rejected with 400 when the policy would stop allowing an executor or fixed model used by a shipped default pipeline or an active workflow definition. The previous active version becomes superseded and an `activated` audit entry records the actor. Runs already created keep their snapshot of the previous policy.
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileActivationRequest" }
      responses:
        "200":
          description: Activated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfileTransitionResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/agent-profiles/{id}/rollback:
    post:
      summary: Restore a previously active version as a new active version
      description: Admin only. The target must have been active at some point and must not be the current active version. The historical version is left unchanged; its body is copied into a new version with `provenance.origin` `rollback` and `rolled_back_from_version`, validated against consumers, and recorded as a `rolled-back` audit entry.
      parameters:
        - $ref: "#/components/parameters/AgentProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileActivationRequest" }
      responses:
        "200":
          description: Rolled-back profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfileTransitionResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/workflow-definitions:
    get:
      summary: List workflow definitions
      responses:
        "200":
          description: Workflow definition list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definitions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definitions]
  /api/workflow-definitions/{id}:
    get:
      summary: Get a workflow definition
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Create or update a workflow definition draft
      description: Returns 400 with a message naming the step and schema location when a step `output_shape` falls outside the supported output-contract subset (see `StepOutputShape` and docs/reference/step-outputs.md). Activation and rollback apply the same check.
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDefinitionUpsertRequest" }
      responses:
        "200":
          description: Updated workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
  /api/workflow-definitions/{id}/versions:
    get:
      summary: List immutable workflow-definition versions
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200": { description: Version history }
  /api/workflow-definitions/{id}/activate:
    post:
      summary: Validate and activate the latest draft version
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200": { description: Activated workflow definition }
  /api/workflow-definitions/{id}/rollback:
    post:
      summary: Restore a historical snapshot as a new active version
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
              required: [version]
      responses:
        "200": { description: Rolled-back workflow definition }
  /api/open-pilot/states:
    get:
      summary: List Open Pilot issue states
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStatesResponse" }
  /api/open-pilot/repository-audit:
    get:
      summary: Report bounded Open Pilot repository affinity and canonical identity readiness
      responses:
        "200": { description: Secret-free singleton admission audit report }
  /api/open-pilot/inbox:
    get:
      summary: List Open Pilot intake candidates with eligibility, claims, and lifecycle state
      description: >-
        Bounded, read-only, control-listener-only intake queue. Lists open issues that carry the queue
        labels or the bot assignee from registered repositories the admission gate currently admits,
        plus durable claims for those repositories. Each issue carries pickup path, specification
        readiness, the command allowlist decision, the existing claim (phase, run, last failure, pull
        request), stable reason codes, and links. `upstream` distinguishes an unavailable or partial
        Gitea listing from an empty queue. The endpoint never claims, dispatches, or writes to Gitea;
        dispatch goes through POST /api/workflows/open-pilot/run and resume through
        POST /api/open-pilot/state/resume, which apply admission, deduplication, and authorization.
        Configuration failures return 200 with blockers; only a malformed query is rejected.
      parameters:
        - name: repo
          in: query
          required: false
          description: Registered canonical slug or alias; limits the listing to that repository
          schema: { type: string, maxLength: 256 }
        - name: eligibility
          in: query
          required: false
          schema: { type: string, enum: [all, eligible, ineligible, claimed], default: all }
        - name: phase
          in: query
          required: false
          description: Only issues whose durable claim is in this lifecycle phase
          schema: { type: string }
        - name: pickup
          in: query
          required: false
          schema: { type: string, enum: [assigned, labels, none] }
        - name: q
          in: query
          required: false
          description: Case-insensitive match on repo#issue, title, labels, and reason codes
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          description: Opaque next_cursor from the previous page
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Inbox page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenPilotInboxReport" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/readiness:
    get:
      summary: Preflight Open Pilot readiness for a repository or issue with structured reason codes
      description: >-
        Composes project registration, repository/executor generation, OpenCode and verifier health,
        rollout mode and fingerprint, durable issue affinity, the command allowlist decision, and
        effective write/CI/merge gates into one bounded control-only report. Configuration and
        prerequisite failures are returned as 200 with `ready=false` and stable `checks[].code`
        values; only a malformed query is rejected. The response never contains passwords, password
        file paths, or host paths, and the route is absent from model ingress.
      parameters:
        - name: repo
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: issue
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
        - name: test_command
          in: query
          required: false
          description: Argv command to evaluate against the repository command allowlist without executing it
          schema: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: Readiness report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenPilotReadinessReport" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/readiness/validate:
    post:
      summary: Dry-run validate an Open Pilot operator registry or runtime manifest document
      description: >-
        Strictly decodes exactly one document, rejects secret-looking material without echoing it,
        validates identities, and compares entries with the loaded runtime registry. It performs no
        cloning, filesystem, network, or admission changes. Requires admin authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenPilotConfigurationDryRunInput" }
      responses:
        "200":
          description: Dry-run validation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenPilotConfigurationDryRunReport" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/rollout:
    get:
      summary: Report durable Open Pilot rollout and singleton rollback readiness
      responses:
        "200": { description: Rollout and rollback evidence }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Atomically close, start bounded proof, or promote the durable Open Pilot rollout gate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigureOpenPilotRollout" }
      responses:
        "200": { description: Updated rollout and rollback evidence }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state:
    get:
      summary: Get Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/pause:
    post:
      summary: Pause Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/resume:
    post:
      summary: Resume Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "201": { $ref: "#/components/responses/OpenPilotResumeResponse" }
        "202": { $ref: "#/components/responses/OpenPilotAcceptedResumeResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/workflows:
    get:
      summary: List workflows
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
                required: [workflows]
  /api/triggers:
    get:
      summary: List triggers
      responses:
        "200":
          description: Trigger list
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: "#/components/schemas/Trigger" }
                required: [triggers]
  /api/triggers/{triggerId}:
    patch:
      summary: Update a trigger
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
      responses:
        "200":
          description: Updated trigger
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger: { $ref: "#/components/schemas/Trigger" }
                required: [trigger]
        default: { $ref: "#/components/responses/Error" }
  /api/triggers/{triggerId}/run:
    post:
      summary: Run a trigger now
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs:
    get:
      summary: List runs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  next_cursor: { type: string }
                required: [runs]
    post:
      summary: Create and dispatch a run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunInput" }
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}:
    get:
      summary: Get run detail
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/retry:
    post:
      summary: Retry a run as a new run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/cancel:
    post:
      summary: Cancel a queued or running run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200": { $ref: "#/components/responses/RunEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps:
    get:
      summary: List run steps
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Step list
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/RunStep" }
                required: [steps]
  /api/runs/{runId}/steps/{stepId}/retry:
    post:
      summary: Retry a step as a resume run
      description: Creates a new run with retry_from_step metadata and resume.* inputs.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "201": { $ref: "#/components/responses/StepRetryEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedStepRetryEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps/{stepId}/cancel:
    post:
      summary: Cancel a queued or running step
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "200":
          description: Canceled step
          content:
            application/json:
              schema:
                type: object
                properties:
                  step: { $ref: "#/components/schemas/RunStep" }
                required: [step]
        default: { $ref: "#/components/responses/Error" }
  /api/workflows/open-pilot/run:
    post:
      summary: Create an Open Pilot run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo: { type: string }
                issue: { type: string }
              required: [repo, issue]
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    controlPlaneBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: SWITCHYARD_CONTROL_API_TOKEN or SWITCHYARD_CONTROL_READ_TOKEN; the read token permits GET and HEAD only.
  parameters:
    RunID:
      name: runId
      in: path
      required: true
      schema: { type: string }
    StepID:
      name: stepId
      in: path
      required: true
      schema: { type: string }
    TriggerID:
      name: triggerId
      in: path
      required: true
      schema: { type: string }
    WorkflowDefinitionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    AgentProfileID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    Repo:
      name: repo
      in: query
      required: true
      schema: { type: string }
    Issue:
      name: issue
      in: query
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RunEnvelope:
      description: Run envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    AcceptedRunEnvelope:
      description: Accepted async run envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    StepRetryEnvelope:
      description: Step retry envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AcceptedStepRetryEnvelope:
      description: Accepted async step retry envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AdapterPayload:
      description: Adapter payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ModelBrokerStatusResponse:
      description: Native ModelBroker status response
      content:
        application/json:
          schema:
            type: object
            properties:
              model_broker: { $ref: "#/components/schemas/ModelBrokerStatus" }
              queue: { $ref: "#/components/schemas/ModelQueue" }
            required: [model_broker, queue]
    OpenCodeExecutorStatusResponse:
      description: Native OpenCodeExecutor status response
      content:
        application/json:
          schema:
            type: object
            properties:
              opencode_executor: { $ref: "#/components/schemas/OpenCodeExecutorStatus" }
            required: [opencode_executor]
    OpenPilotStatesResponse:
      description: Open Pilot issue state list
      content:
        application/json:
          schema:
            type: object
            properties:
              states:
                type: array
                items: { $ref: "#/components/schemas/OpenPilotIssueState" }
