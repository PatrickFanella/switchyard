openapi: 3.1.0
info:
  title: Switchyard Control Plane API
  version: 0.1.0
  description: >-
    Local control-plane API for workflows, runs, triggers, pipelines, workers,
    adapter status, and compatibility ingress. Switchyard also exposes
    llama-line/Ollama-compatible model endpoints on LLAMA_LINE_PORT:
    /broker/status, /v1/chat/completions, /api/chat, /api/generate, /api/tags,
    /v1/models, /api/embed, and /v1/embeddings. Admin queue/inflight and durable
    history/search/log/config compatibility surfaces remain on the authenticated
    control listener and are excluded from model ingress. Compatibility routes
    preserve llama-line/OCQ correlation
    headers (`X-Request-ID`, `X-Llama-Line-Request-ID`, `X-OCQ-Request-ID`,
    `X-OCQ-Session` when available) and serves OpenAI streaming requests as
    native SSE chunks when upstream streaming is available, with buffered
    fallback and queued/running/completed status events. Native broker calls route
    to OpenCode by default and to upstream Ollama when OLLAMA_BASE_URL is
    configured and the model is local or prefixed with ollama/. Requests may be
    submitted durably with `Prefer: respond-async` or `?async=true` and polled at
    `/api/requests/{id}/result`; queued jobs are recovered on API startup. On
    the control-plane listener every non-health request requires an admin or
    read-only bearer token, or an identity asserted by an explicitly trusted
    authenticated reverse proxy. Mutating requests require the admin role.
servers:
  - url: http://127.0.0.1:28080
    description: Local Docker Compose API
  - url: http://127.0.0.1:18080
    description: Local smoke-test API
security:
  - controlPlaneBearer: []
paths:
  /api/model-broker/queue:
    get:
      summary: Get native model queue health
      responses:
        "200":
          description: Exact queue counts with a bounded in-flight ID sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelQueueEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests:
    get:
      summary: List native model requests
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: status, in: query, schema: {type: string}}
        - {name: before, in: query, schema: {type: string}}
      responses:
        "200":
          description: Bounded request list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRequestListEnvelope" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel all queued and running model requests
      responses:
        "200":
          description: Cancellation result with authenticated actor evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelBulkMutationEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a native model request
      responses:
        "200":
          description: Model request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRequestEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Cancel a native model request
      responses:
        "200":
          description: Cancellation state with authenticated actor evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelMutationEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/model-broker/requests/{id}/drop:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Drop a native model request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 256}
      responses:
        "200":
          description: Dropped request with authenticated actor and reason evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelMutationEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /health:
    get:
      security: []
      summary: Compatibility health check
      responses: { "200": { description: API is healthy } }
  /healthz:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /readyz:
    get:
      security: []
      summary: Storage-backed readiness check
      responses:
        "200": { description: API and persistence are ready }
        "503": { description: Persistence is unavailable }
  /broker/status:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Llama-line-compatible broker status
      description: Cutover endpoint served on LLAMA_LINE_PORT; includes native queue/inflight state and upstream health.
      responses:
        "200":
          description: Broker status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatBrokerStatus"
  /v1/chat/completions:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible chat completion
      responses:
        "200":
          description: Completion or SSE stream
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /v1/completions:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible text completion
      responses:
        "200":
          description: Completion
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /v1/embeddings:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible embeddings
      responses: { "200": { description: Embeddings } }
  /v1/models:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: OpenAI-compatible model list
      responses: { "200": { description: Model list } }
  /api/chat:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible chat
      responses:
        "200":
          description: Chat response
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /api/generate:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible generation
      responses:
        "200":
          description: Generation response
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected; absent for supported native ingress, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend; absent for supported native ingress, schema: { type: string } }
        "502":
          description: Synchronous upstream generation failure
          headers:
            X-Switchyard-Backend: { description: Deprecated external backend selected, schema: { type: string } }
            X-Switchyard-Compatibility-Warning: { description: Compatibility warning for a deprecated external backend, schema: { type: string } }
        "202": { description: Async request accepted }
        "429": { $ref: "#/components/responses/Error" }
  /api/embed:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible embeddings alias
      responses: { "200": { description: Embeddings } }
  /api/embeddings:
    post:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible embeddings
      responses: { "200": { description: Embeddings } }
  /api/tags:
    get:
      security: []
      servers: [{url: "http://127.0.0.1:11434", description: Model-compatible ingress (LLAMA_LINE_PORT)}]
      summary: Ollama-compatible model tags
      responses: { "200": { description: Model list } }
  /metrics:
    get:
      summary: Prometheus runtime metrics
      description: >-
        Authenticated control-listener metrics. The public model-listener
        operation is specified in docs/openapi-model-ingress.yaml.
      servers: [{url: "http://127.0.0.1:28080", description: Authenticated control listener}]
      responses: { "200": { description: Prometheus text exposition } }
  /api/observability/model-broker:
    get:
      summary: Model broker latency, errors, and recent requests
      responses: { "200": { description: Model broker observability summary } }
  /admin/queue:
    get:
      summary: List queued compatibility requests
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema: { type: object }
    delete:
      summary: Cancel all queued and inflight compatibility requests
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { type: object }
  /admin/queue/{id}:
    delete:
      summary: Cancel one compatibility request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Request canceled }
        "404": { description: Request not found }
  /admin/inflight:
    get:
      summary: List inflight compatibility requests
      responses:
        "200":
          description: Inflight snapshot
          content:
            application/json:
              schema: { type: object }
  /admin/inflight/cancel:
    post:
      summary: Cancel inflight compatibility requests
      description: Cancels a specific request when `id` or `request_id` is supplied; otherwise cancels all tracked requests.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                request_id: { type: string }
      responses:
        "202": { description: Cancellation accepted }
        "404": { description: Request not found }
  /admin/logs:
    get:
      summary: Legacy llama-line admin logs alias
      description: Alias of `/api/logs`; backed by the durable model broker ledger.
      responses:
        "200": { description: Log entries }
  /admin/logs/recent:
    get:
      summary: Legacy llama-line recent logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /admin/audit:
    get:
      summary: Legacy llama-line audit alias
      description: Audit-style view derived from durable model broker requests.
      responses:
        "200": { description: Audit entries }
  /admin/audit/recent:
    get:
      summary: Legacy llama-line recent audit alias
      description: Alias of `/admin/audit`.
      responses:
        "200": { description: Audit entries }
  /admin/search:
    get:
      summary: Legacy llama-line admin search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /admin/stats/summary:
    get:
      summary: Legacy llama-line stats summary alias
      description: Summarizes request counts, model counts, queue depth, and inflight depth from native state.
      responses:
        "200": { description: Stats summary }
  /admin/feedback:
    get:
      summary: List persisted model feedback
      responses:
        "200": { description: Persisted feedback list }
    post:
      summary: Persist model feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: { type: string }
                rating: { type: integer, minimum: -1, maximum: 1 }
                comment: { type: string, maxLength: 4096 }
              required: [request_id, rating]
      responses:
        "201": { description: Feedback persisted }
  /ui/:
    get:
      summary: Lightweight legacy broker UI landing page
      responses:
        "200": { description: HTML compatibility page }
  /ui/api/status:
    get:
      summary: Legacy UI status alias
      description: Alias of `/broker/status`.
      responses:
        "200": { description: Broker status }
  /ui/api/history:
    get:
      summary: Legacy UI history alias
      description: Alias of `/api/history`.
      responses:
        "200": { description: Request history }
  /ui/api/logs:
    get:
      summary: Legacy UI logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /ui/api/search:
    get:
      summary: Legacy UI search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /ui/api/config:
    get:
      summary: Legacy UI config alias
      description: Alias of `/api/config`.
      responses:
        "200": { description: Compatibility config }
  /api/history:
    get:
      summary: List durable model broker request history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Request history
          content:
            application/json:
              schema: { type: object }
  /api/history/{id}:
    get:
      summary: Get one durable model broker request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /api/search:
    get:
      summary: Search durable model broker requests
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { type: object }
  /api/logs:
    get:
      summary: Return request-log view backed by the durable model broker ledger
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema: { type: object }
  /api/config:
    get:
      summary: Return native model broker compatibility configuration
      responses:
        "200":
          description: Compatibility config
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_broker_selector: { type: string, description: Effective selector; native when unset. }
                  opencode_executor_selector: { type: string, description: Effective selector; native when unset. }
                  model_broker_configured_selector: { type: string, description: Explicit MODEL_BROKER_BACKEND value, when configured. }
                  opencode_executor_configured_selector: { type: string, description: Explicit OPENCODE_EXECUTOR_BACKEND value, when configured. }
                  compatibility_warning: { type: string, description: Present only when a deprecated external selector is active. }
  /api/requests/{id}/result:
    get:
      summary: Poll a durable model broker request result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Result is available }
        "202": { description: Request is queued, running, or cancel-requested }
        "410": { description: Request was canceled }
        "502": { description: Request failed upstream }
  /ocq/sessions:
    get:
      summary: OCQ-compatible native OpenCode session list
      responses:
        "200": { description: Session list }
  /ocq/sessions/{id}:
    get:
      summary: OCQ-compatible native OpenCode session detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session detail }
        "404": { description: Session not found }
  /ocq/sessions/{session}/messages/{id}/abort:
    post:
      summary: OCQ-compatible message abort alias
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
  /ocq/requests:
    get:
      summary: OCQ-compatible request list backed by the model broker ledger
      responses:
        "200": { description: Request list }
  /ocq/requests/{id}:
    get:
      summary: OCQ-compatible request detail backed by the model broker ledger
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /ocq/requests/{id}/abort:
    post:
      summary: OCQ-compatible request abort alias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
        "404": { description: Request not found }
  /ocq/settings:
    get:
      summary: OCQ-compatible native executor settings
      responses:
        "200": { description: Executor settings }
  /ocq/audit:
    get:
      summary: OCQ-compatible audit alias
      description: Alias of the native compatibility audit view.
      responses:
        "200": { description: Audit entries }
  /ocq/logs:
    get:
      summary: OCQ-compatible logs alias
      description: Alias of the native compatibility logs view.
      responses:
        "200": { description: Log entries }
  /api/adapters:
    get:
      summary: List adapter snapshots
      responses:
        "200": { $ref: "#/components/responses/AdapterPayload" }
  /api/models:
    get:
      summary: List available model inventory
      description: Reports installed Ollama models plus OpenCode provider/model metadata when those upstreams are configured.
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  ollama:
                    type: object
                    properties:
                      configured: { type: boolean }
                      base_url: { type: string }
                      status: { type: string }
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            provider: { type: string }
                  opencode:
                    type: object
                    properties:
                      configured: { type: boolean }
                      base_url: { type: string }
                      status: { type: string }
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            provider: { type: string }
                  checked_at: { type: string, format: date-time }
  /api/models/pull:
    post:
      summary: Pull Ollama models through the configured upstream
      description: Pulls one or more Ollama models via upstream `/api/pull` with `stream:false`. OpenCode model downloads are not supported because OpenCode only refreshes provider metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [ollama] }
                models:
                  type: array
                  items: { type: string }
              required: [models]
      responses:
        "200": { description: Pull results }
        "400": { description: Invalid provider or model list }
        "502": { description: Ollama pull failed }
  /api/model-broker/status:
    get:
      summary: Get native ModelBroker status
      description: Reports Switchyard's native model-broker surface. llama-line-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/ModelBrokerStatusResponse" }
  /api/opencode-executor/status:
    get:
      summary: Get native OpenCodeExecutor status
      description: Reports Switchyard's native OpenCode executor surface. OCQ-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/OpenCodeExecutorStatusResponse" }
  /api/scheduler:
    get:
      summary: Get scheduler status
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerStatus" }
  /api/workers:
    get:
      summary: Get worker pool status
      responses:
        "200":
          description: Worker pool status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPoolStatus" }
  /api/retention:
    get:
      summary: Get retention manager status and last prune counts
      responses:
        "200": { description: Retention status }
  /api/artifacts/report:
    get:
      summary: Get bounded inline artifact storage measurements
      description: >-
        Returns retained inline data URI volume, durable created and pruned totals,
        and bounded UTC daily buckets. retention_until is declared metadata;
        actual deletion follows terminal run retention.
      parameters:
        - name: days
          in: query
          description: Number of UTC daily buckets ending today.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Bounded artifact report
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_report: { $ref: "#/components/schemas/ArtifactReport" }
                required: [artifact_report]
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/compatibility/retirement:
    get:
      summary: Get durable deprecated-backend retirement status
      description: Aggregate-only UTC daily usage for deprecated llama-line and OCQ compatibility routes. A backend is eligible only after 90 days of zero attempts; two-release evidence remains an external qualification record.
      responses:
        "200":
          description: Compatibility retirement status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatibilityRetirementStatus" }
  /api/compatibility/report:
    get:
      summary: Generate canonical deprecated-backend observation evidence
      description: >-
        Returns canonical JSON only when every requested elapsed UTC day has a
        completed, revision-bound observation for both llama-line and OCQ.
        Missing rows are never interpreted as zero attempts.
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive UTC start date.
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          description: Inclusive elapsed UTC end date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Complete canonical compatibility observation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  compatibility_report: { $ref: "#/components/schemas/CompatibilityReport" }
                required: [compatibility_report]
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/compatibility/observer:
    get:
      summary: Get compatibility observer health and detected gaps
      responses:
        "200":
          description: Observer health, or disabled status
          content:
            application/json:
              schema: { type: object }
  /api/operator-safety:
    get:
      summary: Get operator safety status
      responses:
        "200":
          description: Operator safety status and warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSafetyStatus" }
  /api/operator-summary:
    get:
      summary: Get bounded Switchyard operator summary
      description: Returns the versioned read-only summary used by external operator surfaces.
      responses:
        "200":
          description: Current scheduler, worker, run, and component summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSummary" }
  /api/pipelines:
    get:
      summary: List pipeline definitions
      responses:
        "200":
          description: Pipeline list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
                required: [pipelines]
  /api/agent-profiles:
    get:
      summary: List agent profiles
      responses:
        "200":
          description: Agent profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfile" }
                required: [profiles]
  /api/workflow-definitions:
    get:
      summary: List workflow definitions
      responses:
        "200":
          description: Workflow definition list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definitions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definitions]
  /api/workflow-definitions/{id}:
    get:
      summary: Get a workflow definition
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Create or update a workflow definition draft
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDefinitionUpsertRequest" }
      responses:
        "200":
          description: Updated workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
  /api/workflow-definitions/{id}/versions:
    get:
      summary: List immutable workflow-definition versions
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200": { description: Version history }
  /api/workflow-definitions/{id}/activate:
    post:
      summary: Validate and activate the latest draft version
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200": { description: Activated workflow definition }
  /api/workflow-definitions/{id}/rollback:
    post:
      summary: Restore a historical snapshot as a new active version
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
              required: [version]
      responses:
        "200": { description: Rolled-back workflow definition }
  /api/open-pilot/states:
    get:
      summary: List Open Pilot issue states
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStatesResponse" }
  /api/open-pilot/state:
    get:
      summary: Get Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/pause:
    post:
      summary: Pause Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/resume:
    post:
      summary: Resume Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "201": { $ref: "#/components/responses/OpenPilotResumeResponse" }
        "202": { $ref: "#/components/responses/OpenPilotAcceptedResumeResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/workflows:
    get:
      summary: List workflows
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
                required: [workflows]
  /api/triggers:
    get:
      summary: List triggers
      responses:
        "200":
          description: Trigger list
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: "#/components/schemas/Trigger" }
                required: [triggers]
  /api/triggers/{triggerId}:
    patch:
      summary: Update a trigger
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
      responses:
        "200":
          description: Updated trigger
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger: { $ref: "#/components/schemas/Trigger" }
                required: [trigger]
        default: { $ref: "#/components/responses/Error" }
  /api/triggers/{triggerId}/run:
    post:
      summary: Run a trigger now
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs:
    get:
      summary: List runs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  next_cursor: { type: string }
                required: [runs]
    post:
      summary: Create and dispatch a run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunInput" }
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}:
    get:
      summary: Get run detail
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/retry:
    post:
      summary: Retry a run as a new run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/cancel:
    post:
      summary: Cancel a queued or running run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200": { $ref: "#/components/responses/RunEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps:
    get:
      summary: List run steps
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Step list
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/RunStep" }
                required: [steps]
  /api/runs/{runId}/steps/{stepId}/retry:
    post:
      summary: Retry a step as a resume run
      description: Creates a new run with retry_from_step metadata and resume.* inputs.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "201": { $ref: "#/components/responses/StepRetryEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedStepRetryEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps/{stepId}/cancel:
    post:
      summary: Cancel a queued or running step
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "200":
          description: Canceled step
          content:
            application/json:
              schema:
                type: object
                properties:
                  step: { $ref: "#/components/schemas/RunStep" }
                required: [step]
        default: { $ref: "#/components/responses/Error" }
  /api/workflows/open-pilot/run:
    post:
      summary: Create an Open Pilot run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo: { type: string }
                issue: { type: string }
              required: [repo, issue]
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    controlPlaneBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: SWITCHYARD_CONTROL_API_TOKEN or SWITCHYARD_CONTROL_READ_TOKEN; the read token permits GET and HEAD only.
  parameters:
    RunID:
      name: runId
      in: path
      required: true
      schema: { type: string }
    StepID:
      name: stepId
      in: path
      required: true
      schema: { type: string }
    TriggerID:
      name: triggerId
      in: path
      required: true
      schema: { type: string }
    WorkflowDefinitionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Repo:
      name: repo
      in: query
      required: true
      schema: { type: string }
    Issue:
      name: issue
      in: query
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RunEnvelope:
      description: Run envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    AcceptedRunEnvelope:
      description: Accepted async run envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    StepRetryEnvelope:
      description: Step retry envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AcceptedStepRetryEnvelope:
      description: Accepted async step retry envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AdapterPayload:
      description: Adapter payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ModelBrokerStatusResponse:
      description: Native ModelBroker status response
      content:
        application/json:
          schema:
            type: object
            properties:
              model_broker: { $ref: "#/components/schemas/ModelBrokerStatus" }
              queue: { $ref: "#/components/schemas/ModelQueue" }
            required: [model_broker, queue]
    OpenCodeExecutorStatusResponse:
      description: Native OpenCodeExecutor status response
      content:
        application/json:
          schema:
            type: object
            properties:
              opencode_executor: { $ref: "#/components/schemas/OpenCodeExecutorStatus" }
            required: [opencode_executor]
    OpenPilotStatesResponse:
      description: Open Pilot issue state list
      content:
        application/json:
          schema:
            type: object
            properties:
              states:
                type: array
                items: { $ref: "#/components/schemas/OpenPilotIssueState" }
            required: [states]
    OpenPilotStateResponse:
      description: Open Pilot issue state response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              next_action: { type: string }
            required: [state, next_action]
    OpenPilotResumeResponse:
      description: Open Pilot resume response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
    OpenPilotAcceptedResumeResponse:
      description: Accepted async Open Pilot resume response
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
  schemas:
    ArtifactDailyBucket:
      type: object
      properties:
        date: { type: string, format: date }
        created: { type: integer, format: int64 }
        created_bytes: { type: integer, format: int64 }
        pruned: { type: integer, format: int64 }
        pruned_bytes: { type: integer, format: int64 }
        pruned_bytes_unmeasured: { type: integer, format: int64, description: Number of legacy pruned artifacts without measured decoded bytes. }
        net_change: { type: integer, format: int64 }
        net_bytes: { type: integer, format: int64 }
      required: [date, created, created_bytes, pruned, pruned_bytes, pruned_bytes_unmeasured, net_change, net_bytes]
    ArtifactReport:
      type: object
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        bucket: { type: string, const: day }
        observation_started_at: { type: string, format: date-time }
        retained: { type: integer, format: int64 }
        retained_bytes: { type: integer, format: int64 }
        retained_bytes_unmeasured: { type: integer, format: int64, description: Number of retained legacy artifacts excluded from retained_bytes because decoded size is unknown. }
        created_total: { type: integer, format: int64 }
        created_bytes_total: { type: integer, format: int64 }
        pruned_total: { type: integer, format: int64 }
        pruned_bytes_total: { type: integer, format: int64 }
        pruned_bytes_unmeasured_total: { type: integer, format: int64, description: Number of legacy artifacts excluded from pruned_bytes_total because decoded size is unknown. }
        declared_retention_missing: { type: integer, format: int64, description: Retained legacy artifacts without retention_until metadata. }
        declared_retention_expired: { type: integer, format: int64 }
        declared_retention_expired_bytes: { type: integer, format: int64 }
        declared_retention_expired_bytes_unmeasured: { type: integer, format: int64, description: Number of declared-expired legacy artifacts excluded from the byte sum. }
        retention_semantics: { type: string }
        buckets:
          type: array
          maxItems: 90
          items: { $ref: "#/components/schemas/ArtifactDailyBucket" }
      required: [window_start, window_end, bucket, observation_started_at, retained, retained_bytes, retained_bytes_unmeasured, created_total, created_bytes_total, pruned_total, pruned_bytes_total, pruned_bytes_unmeasured_total, declared_retention_missing, declared_retention_expired, declared_retention_expired_bytes, declared_retention_expired_bytes_unmeasured, retention_semantics, buckets]
    CompatibilityObservation:
      type: object
      properties:
        date: { type: string, format: date }
        backend: { type: string, enum: [llama-line, ocq] }
        attempts: { type: integer, format: int64, minimum: 0 }
        source_revision: { type: string }
        deployment_id: { type: string }
        observation_started_at: { type: string, format: date-time }
        observation_completed_at: { type: string, format: date-time }
        observation_segment: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
      required: [date, backend, attempts, source_revision, deployment_id, observation_started_at, observation_completed_at, observation_segment]
    CompatibilityReport:
      type: object
      properties:
        version: { type: string, const: switchyard.compatibility-observation/v1 }
        source_revision: { type: string, pattern: "^[0-9a-f]{40}$" }
        source_identity: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        source_segment: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        window_start: { type: string, format: date }
        window_end: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        observations:
          type: array
          maxItems: 180
          items: { $ref: "#/components/schemas/CompatibilityObservation" }
        canonical_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        qualification_eligible: { type: boolean, description: False for non-durable diagnostic stores. }
      required: [version, source_revision, source_identity, source_segment, window_start, window_end, generated_at, observations, canonical_sha256, qualification_eligible]
    StringMap:
      type: object
      additionalProperties: { type: string }
    OpenPilotGateStatus:
      type: object
      additionalProperties: { type: string }
    OpenPilotIssueState:
      type: object
      properties:
        id: { type: string }
        repo: { type: string }
        issue: { type: string }
        phase: { type: string }
        run_id: { type: string }
        last_step_name: { type: string }
        branch: { type: string }
        base: { type: string }
        worktree_path: { type: string }
        pull_request_url: { type: string }
        pull_request_id: { type: integer }
        pull_request_number: { type: integer }
        merge_commit_sha: { type: string }
        issue_closed: { type: boolean }
        gate_status: { $ref: "#/components/schemas/OpenPilotGateStatus" }
        resume_inputs: { $ref: "#/components/schemas/StringMap" }
        repair_attempts: { type: integer }
        max_repair_attempts: { type: integer }
        last_error: { type: string }
        failing_gate: { type: string }
        operator_summary: { type: string }
        recommended_next_action: { type: string }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, repo, issue, phase, issue_closed, repair_attempts, max_repair_attempts, updated_at, created_at]
    ModelBrokerStatus:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [healthy, degraded, unknown, unreachable, failed, not_configured] }
        configured: { type: boolean }
        backend: { type: string }
        transitional_backend: { type: string }
        effective_selector: { type: string, description: Effective request route; native when selectors are unset or unknown. }
        configured_selector: { type: string }
        compatibility_warning: { type: string, example: deprecated-external-backend }
        base_url: { type: string }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        active_request: { type: boolean }
        connected_clients: { type: integer }
        in_flight_request_ids:
          type: array
          items: { type: string }
        upstreams:
          type: array
          items: { $ref: "#/components/schemas/ModelBrokerStatusUpstream" }
        checked_at: { type: string, format: date-time }
        error: { type: string }
      required: [id, status, configured, backend, effective_selector, queue_depth, max_depth, active_request, connected_clients, in_flight_request_ids, upstreams, checked_at]
    ModelRequest:
      type: object
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ModelRequestStatus" }
        model: { type: string }
        path: { type: string }
        client: { type: string }
        client_priority: { type: integer }
        request_body: { type: string }
        response_body: { type: string }
        error: { type: string }
        correlation_ids:
          type: object
          additionalProperties: { type: string }
          description: Includes bounded audit_action, audit_actor, and audit_reason evidence for operator mutations.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancel_requested_at: { type: string, format: date-time }
      required: [id, status, model, path, client, client_priority, created_at, updated_at]
    ModelRequestStatus:
      type: string
      enum: [queued, running, cancel_requested, canceled, completed, failed, dropped]
    ModelQueue:
      type: object
      properties:
        queued: { type: integer, minimum: 0, description: Exact queued request count. }
        running: { type: integer, minimum: 0, description: Exact running request count. }
        cancel_requested: { type: integer, minimum: 0, description: Exact cancel-requested count. }
        max_depth: { type: integer, minimum: 1 }
        in_flight_request_ids:
          type: array
          maxItems: 100
          items: { type: string }
          description: Bounded sample of running and cancel-requested IDs.
      required: [queued, running, cancel_requested, max_depth, in_flight_request_ids]
    ModelQueueEnvelope:
      type: object
      properties:
        queue: { $ref: "#/components/schemas/ModelQueue" }
      required: [queue]
    ModelRequestEnvelope:
      type: object
      properties:
        request: { $ref: "#/components/schemas/ModelRequest" }
      required: [request]
    ModelRequestListEnvelope:
      type: object
      properties:
        requests: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ModelRequest" } }
      required: [requests]
    ModelMutationEnvelope:
      type: object
      properties:
        actor: { type: string, maxLength: 256 }
        request: { $ref: "#/components/schemas/ModelRequest" }
      required: [actor, request]
    ModelBulkMutationEnvelope:
      type: object
      properties:
        actor: { type: string, maxLength: 256 }
        canceled: { type: integer, minimum: 0 }
        requests: { type: array, items: { $ref: "#/components/schemas/ModelRequest" } }
      required: [actor, canceled, requests]
    CompatBrokerStatus:
      type: object
      properties:
        status: { type: string }
        backend: { type: string, enum: [switchyard-native] }
        effective_selector: { type: string, description: Effective request route; native when selectors are unset or unknown. }
        configured_selector: { type: string, description: Explicit MODEL_BROKER_BACKEND value when set. }
        compatibility_warning: { type: string, example: deprecated-external-backend }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        active_request: { type: boolean }
        connected_clients: { type: integer }
        in_flight_ids: { type: array, items: { type: string } }
        queue: { type: array, items: { type: object } }
        inflight: { type: array, items: { type: object } }
        upstreams: { type: array, items: { $ref: "#/components/schemas/ModelBrokerStatusUpstream" } }
        checked_at: { type: string, format: date-time }
        error: { type: string }
      required: [status, backend, effective_selector, queue_depth, max_depth, active_request, connected_clients, in_flight_ids, queue, inflight, upstreams, checked_at]
    ModelBrokerStatusUpstream:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [healthy, failed, unknown] }
        queue_depth: { type: integer }
        max_depth: { type: integer }
        in_flight_id: { type: string }
        last_probe_at: { type: string, format: date-time }
