openapi: 3.1.0
info:
  title: Switchyard Control Plane API
  version: 0.1.0
  description: >-
    Local control-plane API for workflows, runs, triggers, pipelines, workers,
    adapter status, and compatibility ingress. Switchyard also exposes
    llama-line/Ollama-compatible cutover endpoints on LLAMA_LINE_PORT:
    /broker/status, /v1/chat/completions, /api/chat, /api/generate, /api/tags,
    /v1/models, /api/embed, /v1/embeddings, admin queue/inflight endpoints,
    and durable /api/history, /api/search, /api/logs, /api/config compatibility
    surfaces. The compatibility ingress preserves llama-line/OCQ correlation
    headers (`X-Request-ID`, `X-Llama-Line-Request-ID`, `X-OCQ-Request-ID`,
    `X-OCQ-Session` when available) and serves OpenAI streaming requests as
    native SSE chunks when upstream streaming is available, with buffered
    fallback and queued/running/completed status events. Native broker calls route
    to OpenCode by default and to upstream Ollama when OLLAMA_BASE_URL is
    configured and the model is local or prefixed with ollama/. Requests may be
    submitted durably with `Prefer: respond-async` or `?async=true` and polled at
    `/api/requests/{id}/result`; queued jobs are recovered on API startup.
servers:
  - url: http://127.0.0.1:28080
    description: Local Docker Compose API
  - url: http://127.0.0.1:18080
    description: Local smoke-test API
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /broker/status:
    get:
      summary: Llama-line-compatible broker status
      description: Cutover endpoint served on LLAMA_LINE_PORT; includes native queue/inflight state and upstream health.
      responses:
        "200":
          description: Broker status
          content:
            application/json:
              schema: { type: object }
  /admin/queue:
    get:
      summary: List queued compatibility requests
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema: { type: object }
    delete:
      summary: Cancel all queued and inflight compatibility requests
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { type: object }
  /admin/queue/{id}:
    delete:
      summary: Cancel one compatibility request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Request canceled }
        "404": { description: Request not found }
  /admin/inflight:
    get:
      summary: List inflight compatibility requests
      responses:
        "200":
          description: Inflight snapshot
          content:
            application/json:
              schema: { type: object }
  /admin/inflight/cancel:
    post:
      summary: Cancel inflight compatibility requests
      description: Cancels a specific request when `id` or `request_id` is supplied; otherwise cancels all tracked requests.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                request_id: { type: string }
      responses:
        "202": { description: Cancellation accepted }
        "404": { description: Request not found }
  /admin/logs:
    get:
      summary: Legacy llama-line admin logs alias
      description: Alias of `/api/logs`; backed by the durable model broker ledger.
      responses:
        "200": { description: Log entries }
  /admin/logs/recent:
    get:
      summary: Legacy llama-line recent logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /admin/audit:
    get:
      summary: Legacy llama-line audit alias
      description: Audit-style view derived from durable model broker requests.
      responses:
        "200": { description: Audit entries }
  /admin/audit/recent:
    get:
      summary: Legacy llama-line recent audit alias
      description: Alias of `/admin/audit`.
      responses:
        "200": { description: Audit entries }
  /admin/search:
    get:
      summary: Legacy llama-line admin search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /admin/stats/summary:
    get:
      summary: Legacy llama-line stats summary alias
      description: Summarizes request counts, model counts, queue depth, and inflight depth from native state.
      responses:
        "200": { description: Stats summary }
  /admin/feedback:
    get:
      summary: Legacy feedback compatibility status
      responses:
        "200": { description: Feedback compatibility status }
    post:
      summary: Accept legacy feedback compatibility payloads
      description: Accepts feedback for compatibility but does not persist it.
      responses:
        "202": { description: Feedback accepted }
  /ui/:
    get:
      summary: Lightweight legacy broker UI landing page
      responses:
        "200": { description: HTML compatibility page }
  /ui/api/status:
    get:
      summary: Legacy UI status alias
      description: Alias of `/broker/status`.
      responses:
        "200": { description: Broker status }
  /ui/api/history:
    get:
      summary: Legacy UI history alias
      description: Alias of `/api/history`.
      responses:
        "200": { description: Request history }
  /ui/api/logs:
    get:
      summary: Legacy UI logs alias
      description: Alias of `/api/logs`.
      responses:
        "200": { description: Log entries }
  /ui/api/search:
    get:
      summary: Legacy UI search alias
      description: Alias of `/api/search`.
      responses:
        "200": { description: Search results }
  /ui/api/config:
    get:
      summary: Legacy UI config alias
      description: Alias of `/api/config`.
      responses:
        "200": { description: Compatibility config }
  /api/history:
    get:
      summary: List durable model broker request history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Request history
          content:
            application/json:
              schema: { type: object }
  /api/history/{id}:
    get:
      summary: Get one durable model broker request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /api/search:
    get:
      summary: Search durable model broker requests
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { type: object }
  /api/logs:
    get:
      summary: Return request-log view backed by the durable model broker ledger
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema: { type: object }
  /api/config:
    get:
      summary: Return native model broker compatibility configuration
      responses:
        "200":
          description: Compatibility config
          content:
            application/json:
              schema: { type: object }
  /api/requests/{id}/result:
    get:
      summary: Poll a durable model broker request result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Result is available }
        "202": { description: Request is queued, running, or cancel-requested }
        "410": { description: Request was canceled }
        "502": { description: Request failed upstream }
  /ocq/sessions:
    get:
      summary: OCQ-compatible native OpenCode session list
      responses:
        "200": { description: Session list }
  /ocq/sessions/{id}:
    get:
      summary: OCQ-compatible native OpenCode session detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session detail }
        "404": { description: Session not found }
  /ocq/sessions/{session}/messages/{id}/abort:
    post:
      summary: OCQ-compatible message abort alias
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
  /ocq/requests:
    get:
      summary: OCQ-compatible request list backed by the model broker ledger
      responses:
        "200": { description: Request list }
  /ocq/requests/{id}:
    get:
      summary: OCQ-compatible request detail backed by the model broker ledger
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request detail }
        "404": { description: Request not found }
  /ocq/requests/{id}/abort:
    post:
      summary: OCQ-compatible request abort alias
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Abort accepted }
        "404": { description: Request not found }
  /ocq/settings:
    get:
      summary: OCQ-compatible native executor settings
      responses:
        "200": { description: Executor settings }
  /ocq/audit:
    get:
      summary: OCQ-compatible audit alias
      description: Alias of the native compatibility audit view.
      responses:
        "200": { description: Audit entries }
  /ocq/logs:
    get:
      summary: OCQ-compatible logs alias
      description: Alias of the native compatibility logs view.
      responses:
        "200": { description: Log entries }
  /api/adapters:
    get:
      summary: List adapter snapshots
      responses:
        "200": { $ref: "#/components/responses/AdapterPayload" }
  /api/model-broker/status:
    get:
      summary: Get native ModelBroker status
      description: Reports Switchyard's native model-broker surface. llama-line-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/ModelBrokerStatusResponse" }
  /api/opencode-executor/status:
    get:
      summary: Get native OpenCodeExecutor status
      description: Reports Switchyard's native OpenCode executor surface. OCQ-compatible ingress may back it during cutover.
      responses:
        "200": { $ref: "#/components/responses/OpenCodeExecutorStatusResponse" }
  /api/scheduler:
    get:
      summary: Get scheduler status
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerStatus" }
  /api/workers:
    get:
      summary: Get worker pool status
      responses:
        "200":
          description: Worker pool status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPoolStatus" }
  /api/operator-safety:
    get:
      summary: Get operator safety status
      responses:
        "200":
          description: Operator safety status and warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSafetyStatus" }
  /api/pipelines:
    get:
      summary: List pipeline definitions
      responses:
        "200":
          description: Pipeline list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
                required: [pipelines]
  /api/agent-profiles:
    get:
      summary: List agent profiles
      responses:
        "200":
          description: Agent profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/AgentProfile" }
                required: [profiles]
  /api/workflow-definitions:
    get:
      summary: List workflow definitions
      responses:
        "200":
          description: Workflow definition list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definitions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definitions]
  /api/workflow-definitions/{id}:
    get:
      summary: Get a workflow definition
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Create or update a workflow definition
      parameters:
        - $ref: "#/components/parameters/WorkflowDefinitionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDefinitionUpsertRequest" }
      responses:
        "200":
          description: Updated workflow definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                required: [workflow_definition]
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/states:
    get:
      summary: List Open Pilot issue states
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStatesResponse" }
  /api/open-pilot/state:
    get:
      summary: Get Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/pause:
    post:
      summary: Pause Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "200": { $ref: "#/components/responses/OpenPilotStateResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/open-pilot/state/resume:
    post:
      summary: Resume Open Pilot issue state
      parameters:
        - $ref: "#/components/parameters/Repo"
        - $ref: "#/components/parameters/Issue"
      responses:
        "201": { $ref: "#/components/responses/OpenPilotResumeResponse" }
        "202": { $ref: "#/components/responses/OpenPilotAcceptedResumeResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/workflows:
    get:
      summary: List workflows
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
                required: [workflows]
  /api/triggers:
    get:
      summary: List triggers
      responses:
        "200":
          description: Trigger list
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: "#/components/schemas/Trigger" }
                required: [triggers]
  /api/triggers/{triggerId}:
    patch:
      summary: Update a trigger
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
      responses:
        "200":
          description: Updated trigger
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger: { $ref: "#/components/schemas/Trigger" }
                required: [trigger]
        default: { $ref: "#/components/responses/Error" }
  /api/triggers/{triggerId}/run:
    post:
      summary: Run a trigger now
      parameters:
        - $ref: "#/components/parameters/TriggerID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs:
    get:
      summary: List runs
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                required: [runs]
    post:
      summary: Create and dispatch a run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunInput" }
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}:
    get:
      summary: Get run detail
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/retry:
    post:
      summary: Retry a run as a new run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/cancel:
    post:
      summary: Cancel a queued or running run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200": { $ref: "#/components/responses/RunEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps:
    get:
      summary: List run steps
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Step list
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/RunStep" }
                required: [steps]
  /api/runs/{runId}/steps/{stepId}/retry:
    post:
      summary: Retry a step as a resume run
      description: Creates a new run with retry_from_step metadata and resume.* inputs.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "201": { $ref: "#/components/responses/StepRetryEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedStepRetryEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /api/runs/{runId}/steps/{stepId}/cancel:
    post:
      summary: Cancel a queued or running step
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/StepID"
      responses:
        "200":
          description: Canceled step
          content:
            application/json:
              schema:
                type: object
                properties:
                  step: { $ref: "#/components/schemas/RunStep" }
                required: [step]
        default: { $ref: "#/components/responses/Error" }
  /api/workflows/open-pilot/run:
    post:
      summary: Create an Open Pilot run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo: { type: string }
                issue: { type: string }
              required: [repo, issue]
      responses:
        "201": { $ref: "#/components/responses/RunEnvelope" }
        "202": { $ref: "#/components/responses/AcceptedRunEnvelope" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    RunID:
      name: runId
      in: path
      required: true
      schema: { type: string }
    StepID:
      name: stepId
      in: path
      required: true
      schema: { type: string }
    TriggerID:
      name: triggerId
      in: path
      required: true
      schema: { type: string }
    WorkflowDefinitionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Repo:
      name: repo
      in: query
      required: true
      schema: { type: string }
    Issue:
      name: issue
      in: query
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RunEnvelope:
      description: Run envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    AcceptedRunEnvelope:
      description: Accepted async run envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
            required: [run]
    StepRetryEnvelope:
      description: Step retry envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AcceptedStepRetryEnvelope:
      description: Accepted async step retry envelope
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              run: { $ref: "#/components/schemas/Run" }
              step: { $ref: "#/components/schemas/RunStep" }
            required: [run, step]
    AdapterPayload:
      description: Adapter payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ModelBrokerStatusResponse:
      description: Native ModelBroker status response
      content:
        application/json:
          schema:
            type: object
            properties:
              model_broker: { $ref: "#/components/schemas/ModelBrokerStatus" }
            required: [model_broker]
    OpenCodeExecutorStatusResponse:
      description: Native OpenCodeExecutor status response
      content:
        application/json:
          schema:
            type: object
            properties:
              opencode_executor: { $ref: "#/components/schemas/OpenCodeExecutorStatus" }
            required: [opencode_executor]
    OpenPilotStatesResponse:
      description: Open Pilot issue state list
      content:
        application/json:
          schema:
            type: object
            properties:
              states:
                type: array
                items: { $ref: "#/components/schemas/OpenPilotIssueState" }
            required: [states]
    OpenPilotStateResponse:
      description: Open Pilot issue state response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              next_action: { type: string }
            required: [state, next_action]
    OpenPilotResumeResponse:
      description: Open Pilot resume response
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
    OpenPilotAcceptedResumeResponse:
      description: Accepted async Open Pilot resume response
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { $ref: "#/components/schemas/OpenPilotIssueState" }
              run: { $ref: "#/components/schemas/Run" }
              next_action: { type: string }
            required: [state, run, next_action]
  schemas:
    StringMap:
      type: object
      additionalProperties: { type: string }
    OpenPilotGateStatus:
      type: object
      additionalProperties: { type: string }
    OpenPilotIssueState:
      type: object
      properties:
        id: { type: string }
        repo: { type: string }
        issue: { type: string }
        phase: { type: string }
        run_id: { type: string }
        last_step_name: { type: string }
        branch: { type: string }
        base: { type: string }
        worktree_path: { type: string }
        pull_request_url: { type: string }
        pull_request_id: { type: integer }
        pull_request_number: { type: integer }
        merge_commit_sha: { type: string }
        issue_closed: { type: boolean }
        gate_status: { $ref: "#/components/schemas/OpenPilotGateStatus" }
        resume_inputs: { $ref: "#/components/schemas/StringMap" }
        repair_attempts: { type: integer }
        max_repair_attempts: { type: integer }
        last_error: { type: string }
        failing_gate: { type: string }
        operator_summary: { type: string }
        recommended_next_action: { type: string }
        updated_at: { type: string, format: date-time }
