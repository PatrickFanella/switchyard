name: switchyard-production-verify

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact annotated release tag to qualify
        required: true
        type: string
      pull_request:
        description: Credential-free HTTPS repository /pulls/<positive integer> URL
        required: true
        type: string
      rollback_target:
        description: Previous semver-like release tag or full lowercase Git SHA
        required: true
        type: string
      retirement_proposal:
        description: Request deprecated-selector retirement proposal qualification
        required: true
        default: false
        type: boolean
      retirement_report_run_id:
        description: Gitea run ID containing the exact compatibility report artifact
        required: false
        type: string
      retirement_report_artifact_id:
        description: Gitea artifact ID for the exact compatibility report
        required: false
        type: string
      retirement_prior_releases:
        description: JSON array of exactly two prior Gitea Actions run_id/artifact_id records
        required: false
        type: string
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  verify-production:
    runs-on: switchyard-production
    timeout-minutes: 90
    env:
      # CI-only Compose validation value; never use for a deployed database.
      POSTGRES_PASSWORD: switchyard-ci-only-not-a-secret
      # The Docker-socket job container reaches test containers through this runner network.
      SWITCHYARD_TEST_DOCKER_NETWORK: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name != 'workflow_dispatch'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify annotated candidate tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$GITHUB_SHA" = "$TAG_SHA"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
      - name: Verify production runner tool contract
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "Runner contract failure: $*" >&2; exit 1; }
          command -v go >/dev/null || fail "Go 1.26.6 is required"
          [ "$(go version | awk '{print $3}')" = "go1.26.6" ] || fail "expected Go 1.26.6; found $(go version)"
          command -v node >/dev/null || fail "Node.js 24 is required"
          [ "$(node -p 'process.versions.node.split(".")[0]')" = "24" ] || fail "expected Node.js major 24; found $(node --version)"
          command -v corepack >/dev/null || fail "Corepack is required to provide pnpm 10.33.0"
          corepack enable || fail "could not enable Corepack"
          corepack prepare pnpm@10.33.0 --activate || fail "could not activate pnpm 10.33.0 with Corepack"
          command -v pnpm >/dev/null || fail "pnpm 10.33.0 was not activated by Corepack"
          [ "$(pnpm --version)" = "10.33.0" ] || fail "expected pnpm 10.33.0 via Corepack; found $(pnpm --version)"
          command -v make >/dev/null || fail "Make is required"
          make --version >/dev/null || fail "Make is not runnable"
          command -v docker >/dev/null || fail "Docker Engine is required"
          docker --version >/dev/null || fail "Docker Engine is not runnable"
          docker compose version >/dev/null || fail "Docker Compose plugin is required"
          docker buildx version >/dev/null || fail "Docker Buildx is required"
          docker buildx inspect --bootstrap
      - name: Verify Buildx attestation support
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s\n' 'FROM scratch' > "$tmpdir/Dockerfile"
          docker buildx build --platform linux/amd64 \
            --attest type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68 \
            --provenance=mode=max \
            --output type=oci,dest="$tmpdir/attestation-check.oci.tar" \
            "$tmpdir"
          test -s "$tmpdir/attestation-check.oci.tar"
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify production qualification
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          export CI_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          make verify-production
          make api-soak-extended
          test "$(node -p 'require("./release/manifest.json").source_revision')" = "$(git rev-parse HEAD)"
          git diff --exit-code -- ':(glob)backend/**/*.go'
      - name: Download prior retirement qualifications
        if: github.event_name == 'workflow_dispatch' && inputs.retirement_proposal
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          RETIREMENT_PRIOR_RELEASES_JSON: ${{ inputs.retirement_prior_releases }}
        run: |
          python3 scripts/download_retirement_qualifications.py \
            --references "$RETIREMENT_PRIOR_RELEASES_JSON" \
            --api-url "${{ gitea.api_url }}" \
            --repository "${{ gitea.repository }}" \
            --output release/prior-qualifying-releases
      - name: Download candidate retirement report
        if: github.event_name == 'workflow_dispatch' && inputs.retirement_proposal
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          RETIREMENT_REPORT_RUN_ID: ${{ inputs.retirement_report_run_id }}
          RETIREMENT_REPORT_ARTIFACT_ID: ${{ inputs.retirement_report_artifact_id }}
        run: |
          python3 scripts/download_retirement_report.py \
            --api-url "${{ gitea.api_url }}" \
            --repository "${{ gitea.repository }}" \
            --run-id "$RETIREMENT_REPORT_RUN_ID" \
            --artifact-id "$RETIREMENT_REPORT_ARTIFACT_ID" \
            --output release/compatibility-retirement-report.json
      - name: Generate candidate release evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_PULL_REQUEST: ${{ inputs.pull_request }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ROLLBACK_TARGET: ${{ inputs.rollback_target }}
          RETIREMENT_PROPOSAL: ${{ inputs.retirement_proposal }}
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)" python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_json_bytes(payload, label):
              def reject_duplicates(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise SystemExit(f"{label} contains duplicate JSON key {key!r}")
                      result[key] = value
                  return result
              try:
                  return json.loads(payload.decode("utf-8"), object_pairs_hook=reject_duplicates)
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit(f"cannot parse {label}: {error}")

          manifest = json.loads(Path("release/manifest.json").read_text())
          if manifest.get("release_tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("manifest release tag does not match dispatch release tag")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          evidence = {
              "schema_version": 1,
              "phase": "candidate",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "release_tag": manifest["release_tag"],
              "pull_request": os.environ["RELEASE_PULL_REQUEST"],
              "ci_run": run_url,
              "migration_head": manifest["migration_head"],
              "rollback_target": os.environ["ROLLBACK_TARGET"],
              "exceptions": [],
              "recorded_at": now,
              "gates": {
                  "verify_production": {"status": "passed", "completed_at": now, "proof": run_url},
                  "extended_soak": {"status": "passed", "completed_at": now, "proof": run_url},
              },
              "artifacts": [
                  {"archive": image["archive"], "archive_sha256": image["archive_sha256"]}
                  for image in manifest["images"]
              ],
          }
          if os.environ.get("RETIREMENT_PROPOSAL", "false").lower() == "true":
              try:
                  report_payload = Path("release/compatibility-retirement-report.json").read_bytes()
              except OSError as error:
                  raise SystemExit(f"cannot read downloaded candidate retirement report: {error}")
              report = parse_json_bytes(report_payload, "candidate retirement report")
              prior_releases = []
              prior_dir = Path("release/prior-qualifying-releases")
              for index in range(2):
                  qualification_path = prior_dir / str(index) / "retirement-release-qualification.json"
                  try:
                      qualification_payload = qualification_path.read_bytes()
                  except OSError as error:
                      raise SystemExit(f"cannot read prior release {index} qualification: {error}")
                  qualification_hash = hashlib.sha256(qualification_payload).hexdigest()
                  qualification = parse_json_bytes(qualification_payload, f"prior release {index} qualification")
                  bindings = {
                      "release_tag": qualification["release_tag"],
                      "release_sha": qualification["release_sha"],
                      "qualification_artifact": str(qualification_path.relative_to("release")),
                      "qualification_raw_sha256": qualification_hash,
                  }
                  prior_releases.append(bindings)
              canonical = json.dumps(report, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
              report_path = Path("release/compatibility-retirement-report.json")
              evidence["retirement_proposal"] = {
                  "report": {
                      "artifact": "compatibility-retirement-report.json",
                      "raw_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
                      "canonical_sha256": hashlib.sha256(canonical).hexdigest(),
                      "source_revision": report.get("source_revision"),
                      "source_identity": report.get("source_identity"),
                      "source_segment": report.get("source_segment"),
                  },
                  "prior_qualifying_releases": prior_releases,
              }
          Path("release/candidate-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          if [ "${RETIREMENT_PROPOSAL,,}" = "true" ]; then
            make release-evidence-verify CANDIDATE_SHA="$(git rev-parse HEAD)" EVIDENCE=release/candidate-evidence.json MANIFEST=release/manifest.json RETIREMENT_REPORT=release/compatibility-retirement-report.json ARTIFACT_ROOT=release
          else
            make release-evidence-verify CANDIDATE_SHA="$(git rev-parse HEAD)" EVIDENCE=release/candidate-evidence.json MANIFEST=release/manifest.json
          fi
      - name: Upload candidate release evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-release-evidence-${{ github.sha }}
          path: |
            release/candidate-evidence.json
            release/compatibility-retirement-report.json
            release/prior-qualifying-releases/**/*.json
            release/manifest.json
            release/SHA256SUMS
            release/*.oci.tar
          if-no-files-found: error
          retention-days: 30
      - name: Upload durable candidate release record
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-release-record-${{ github.sha }}
          path: |
            release/candidate-evidence.json
            release/manifest.json
          if-no-files-found: error
          retention-days: 400
